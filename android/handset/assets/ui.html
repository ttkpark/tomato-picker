<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>젯슨 핸드셋</title>
<style>
/* ── 토큰 ──────────────────────────────────────────────────────────────
   밝은 테마가 기본. 어두운 쪽은 토큰만 다시 정의한다. 네이티브가 시스템
   다크모드를 읽어 data-theme을 박아주므로 [data-theme] 규칙이 최종 결정자다. */
:root {
  --ground:#F7F4F7; --panel:#FFFFFF; --panel-sunk:#F1EDF2;
  --edge:#E0D8E2; --edge-strong:#C8BCCB;
  --ink:#241C28; --ink-soft:#5C4F62; --ink-faint:#8B7E91;
  --plum:#6B3E70; --signal:#B4741A; --signal-soft:#F5E7D2; --on-signal:#FFFFFF;
  --live:#2E7D52; --alert:#B33A33;
  --shadow:0 1px 2px rgba(36,28,40,.06), 0 8px 24px -12px rgba(36,28,40,.18);
  --radius:10px;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"Roboto Mono","DroidSansMono",monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#17121B; --panel:#1F1926; --panel-sunk:#140F18;
    --edge:#33283A; --edge-strong:#4A3A53;
    --ink:#EFE7F1; --ink-soft:#B4A5BB; --ink-faint:#7D6E85;
    --plum:#A874AE; --signal:#E8A33D; --signal-soft:#3A2C1A; --on-signal:#1A1207;
    --live:#4FB477; --alert:#E2685F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:#17121B; --panel:#1F1926; --panel-sunk:#140F18;
  --edge:#33283A; --edge-strong:#4A3A53;
  --ink:#EFE7F1; --ink-soft:#B4A5BB; --ink-faint:#7D6E85;
  --plum:#A874AE; --signal:#E8A33D; --signal-soft:#3A2C1A; --on-signal:#1A1207;
  --live:#4FB477; --alert:#E2685F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;
}
.wrap{
  min-height:100%; max-width:680px; margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:13px;
}

.plate{display:flex;align-items:center;gap:12px;padding-bottom:11px;border-bottom:2px solid var(--plum);}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);}
.plate h1{margin:1px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em;}
.plate .grow{flex:1;min-width:0;}

.lamp{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:11.5px;font-weight:500;padding:5px 10px 5px 8px;border:1px solid var(--edge);
  border-radius:999px;background:var(--panel);color:var(--ink-soft);white-space:nowrap;}
.lamp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none;}
.lamp[data-state="live"]{color:var(--live);border-color:var(--live);}
.lamp[data-state="live"]::before{background:var(--live);}
.lamp[data-state="wait"]{color:var(--signal);border-color:var(--signal);}
.lamp[data-state="wait"]::before{background:var(--signal);animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.25;}}
@media (prefers-reduced-motion: reduce){.lamp[data-state="wait"]::before{animation:none;}}

.addr{background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--signal);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px;
  display:flex;flex-direction:column;gap:9px;}
.addr .label{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);}
.addr .ip{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15;}
.addr .ip.empty{font-size:15px;font-weight:400;color:var(--ink-faint);letter-spacing:0;
  font-family:var(--sans);}
.addr .net{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
.addr .acts{display:flex;flex-wrap:wrap;gap:8px;}

.console{flex:1;min-height:170px;max-height:46vh;background:var(--panel-sunk);
  border:1px solid var(--edge);border-radius:var(--radius);padding:11px 13px;
  overflow-y:auto;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.entry{padding:5px 0;border-top:1px solid var(--edge);}
.entry:first-child{border-top:0;padding-top:0;}
.entry .meta{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:2px;}
.entry.cmd{color:var(--signal);font-weight:500;}
.entry.err{color:var(--alert);}
.entry.note{color:var(--ink-faint);}

.deck{display:flex;flex-direction:column;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
button,.btn{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink);
  background:var(--panel);border:1px solid var(--edge-strong);border-radius:8px;
  padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .12s ease,border-color .12s ease;}
button:active:not(:disabled){background:var(--signal-soft);border-color:var(--signal);}
button:disabled{opacity:.42;}
button.primary{background:var(--signal);border-color:var(--signal);color:var(--on-signal);font-weight:600;}
button.chip{font-family:var(--mono);font-size:12.5px;padding:7px 12px;}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}

.row{display:flex;gap:8px;}
input{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--edge-strong);border-radius:8px;padding:10px 11px;}
input::placeholder{color:var(--ink-faint);}

details{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:0 13px;}
details[open]{padding-bottom:13px;}
summary{cursor:pointer;padding:11px 0;font-size:13.5px;font-weight:500;list-style:none;
  display:flex;align-items:center;gap:7px;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\25B8";color:var(--plum);font-size:11px;}
details[open] summary::before{content:"\25BE";}
details .fields{display:flex;flex-direction:column;gap:8px;}
.hint{font-size:12px;color:var(--ink-faint);margin:0;}
.hint code{font-family:var(--mono);font-size:11.5px;background:var(--panel-sunk);
  padding:1px 5px;border-radius:4px;border:1px solid var(--edge);}
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <header class="plate">
    <div class="grow">
      <div class="eyebrow">Tomato-picker &middot; BLE Link</div>
      <h1>젯슨 핸드셋</h1>
    </div>
    <span class="lamp" id="lamp" data-state="off">끊김</span>
  </header>

  <section class="addr">
    <span class="label">젯슨 주소</span>
    <div class="ip empty" id="ipText">아직 모릅니다 &mdash; 연결한 뒤 [ip]</div>
    <div class="net" id="netText" hidden></div>
    <div class="acts">
      <button id="btnConnect" class="primary">블루투스 연결</button>
      <button id="btnCopy" disabled>주소 복사</button>
      <button id="btnDash" hidden>대시보드 열기</button>
    </div>
  </section>

  <div class="console" id="console" aria-live="polite"></div>

  <div class="deck">
    <div class="chips">
      <button class="chip" data-cmd="ip" disabled>ip</button>
      <button class="chip" data-cmd="wifi" disabled>wifi</button>
      <button class="chip" data-cmd="status" disabled>status</button>
      <button class="chip" data-cmd="sys" disabled>sys</button>
      <button class="chip" data-cmd="help" disabled>help</button>
    </div>

    <form class="row" id="cmdForm">
      <input id="cmdInput" placeholder="명령 입력 (예: restart line-follow)"
             autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
      <button type="submit" id="btnSend" disabled>보내기</button>
    </form>

    <details id="wifiPanel">
      <summary>WiFi 갈아타기</summary>
      <div class="fields">
        <input id="ssid" placeholder="SSID (공백 있어도 됩니다)" autocomplete="off" spellcheck="false">
        <input id="psk" type="password" placeholder="비밀번호" autocomplete="off">
        <div class="row">
          <button id="btnScan" disabled>주변 망 보기</button>
          <button id="btnJoin" class="primary" disabled>이 망으로 접속</button>
        </div>
        <p class="hint">블루투스 링크는 WiFi를 갈아타도 끊기지 않습니다 &mdash; 바뀐 주소가 위 카드에 바로 뜹니다.</p>
      </div>
    </details>

    <details id="tokenPanel">
      <summary>접속 토큰</summary>
      <div class="fields">
        <input id="token" placeholder="예: d270dba7" autocomplete="off" spellcheck="false">
        <p class="hint">젯슨의 <code>/etc/tomato-ble-token</code>에 있습니다. 폰에 저장되며 연결할 때마다 자동으로 보냅니다.</p>
      </div>
    </details>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    lamp: $("lamp"), ipText: $("ipText"), netText: $("netText"),
    connect: $("btnConnect"), copy: $("btnCopy"), dash: $("btnDash"),
    console: $("console"), form: $("cmdForm"), input: $("cmdInput"), send: $("btnSend"),
    ssid: $("ssid"), psk: $("psk"), scan: $("btnScan"), join: $("btnJoin"),
    token: $("token"), tokenPanel: $("tokenPanel")
  };
  var currentIp = null, live = false;
  var has = typeof Native !== "undefined";

  // 이 로봇의 현재 토큰. 폰에 저장된 값이 있으면 그게 이긴다.
  // ⚠ 토큰을 바꿨으면(젯슨에서 /etc/tomato-ble-token 삭제 후 재시작) 아래 [접속 토큰]에
  //    새 값을 넣으면 된다 — 앱을 다시 만들 필요는 없다.
  var DEFAULT_TOKEN = "d270dba7";

  function print(text, kind) {
    var now = new Date().toTimeString().slice(0, 8);
    var el = document.createElement("div");
    el.className = "entry" + (kind ? " " + kind : "");
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = now + (kind === "cmd" ? "  보냄" : "");
    el.appendChild(meta);
    el.appendChild(document.createTextNode(text));
    els.console.appendChild(el);
    els.console.scrollTop = els.console.scrollHeight;
  }

  function setLive(on) {
    live = on;
    var chips = document.querySelectorAll("button.chip");
    for (var i = 0; i < chips.length; i++) chips[i].disabled = !on;
    els.input.disabled = !on; els.send.disabled = !on;
    els.scan.disabled = !on; els.join.disabled = !on;
    els.connect.textContent = on ? "연결 끊기" : "블루투스 연결";
  }

  function harvest(text) {
    var m = text.match(/http:\/\/(\d{1,3}(?:\.\d{1,3}){3}):8090/);
    if (m) {
      currentIp = m[1];
      els.ipText.textContent = currentIp;
      els.ipText.className = "ip";
      els.copy.disabled = false;
      els.dash.hidden = false;
    }
    var w = text.match(/^WiFi:\s*(.+)$/m);
    if (w) { els.netText.textContent = "WiFi · " + w[1].trim(); els.netText.hidden = false; }
  }

  // ── 네이티브가 부르는 것들 ──────────────────────────────────────────
  window.applyTheme = function (t) { document.documentElement.setAttribute("data-theme", t); };
  window.applyToken = function (t) { els.token.value = (t && t.trim()) || DEFAULT_TOKEN; };

  window.onNativeState = function (state, label, note) {
    els.lamp.dataset.state = state;
    els.lamp.textContent = label;
    setLive(state === "live");
    if (note) print(note, state === "off" ? "err" : "note");
    if (state === "live") {
      var tok = els.token.value.trim();
      if (tok) { send("auth " + tok); }
      else { print("토큰이 없습니다 — 아래 [접속 토큰]에 넣어 주세요.", "note"); els.tokenPanel.open = true; }
    }
  };

  window.onNativeText = function (text) {
    print(text, /실패|오류|틀렸|없습니다|거부/.test(text) ? "err" : null);
    harvest(text);
  };

  // ── 화면 → 네이티브 ────────────────────────────────────────────────
  function send(line) {
    print(line, "cmd");
    if (has) Native.send(line);
  }

  els.connect.addEventListener("click", function () {
    if (!has) { print("네이티브 브리지가 없습니다.", "err"); return; }
    if (live) Native.disconnect(); else Native.connect();
  });

  var chips = document.querySelectorAll("button.chip");
  for (var i = 0; i < chips.length; i++) {
    (function (b) { b.addEventListener("click", function () { send(b.dataset.cmd); }); })(chips[i]);
  }

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = els.input.value.trim();
    if (v) { send(v); els.input.value = ""; }
  });

  els.scan.addEventListener("click", function () { send("wifi"); });

  els.join.addEventListener("click", function () {
    var s = els.ssid.value.trim(), p = els.psk.value;
    if (!s || !p) { print("SSID와 비밀번호를 모두 넣어 주세요.", "err"); return; }
    // 젯슨은 마지막 토큰을 비밀번호로 자른다 — SSID에 공백이 있어도 그대로 보내면 된다
    send("join " + s + " " + p);
  });

  els.copy.addEventListener("click", function () {
    if (currentIp && has) Native.copy(currentIp);
  });

  els.dash.addEventListener("click", function () {
    if (currentIp && has) Native.openUrl("http://" + currentIp + ":8090");
  });

  els.token.addEventListener("change", function () {
    if (has) Native.saveToken(els.token.value.trim());
  });

  setLive(false);
  print("[블루투스 연결]을 누르면 tomato-jetson을 찾습니다.", "note");
})();
</script>
</body>
</html>
