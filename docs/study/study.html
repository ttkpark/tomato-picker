<script>
const DOCS = [{"id": "00", "file": "00_OVERVIEW_ROADMAP.md", "title": "토마토 수확 로봇 아키텍처 및 6단계 마스터 로드맵", "md": "# 토마토 수확 로봇 아키텍처 및 6단계 마스터 로드맵\n> **Autonomous Robotic Tomato Harvesting: System Architecture, Spatial Perception & Learning Roadmap**\n\n---\n\n## 1. 개요 (Overview)\n\n토마토 자동 수확(Robotic Tomato Harvesting)은 농업 로보틱스(Agricultural Robotics) 분야에서 가장 기술적 난이도가 높은 과제 중 하나입니다. 산업용 픽 앤 플레이스(Pick-and-place)와 달리, 온실 및 노지 환경의 과채류 수확은 **완벽한 비정형(Unstructured), 고밀도 가려짐(Heavy Occlusion), 복잡한 조명 변화(Varying Illumination)**를 극복해야 합니다.\n\n특히 토마토는 사과나 배와 달리 다음과 같은 고유한 생물학적/물리적 특성을 가집니다:\n1. **과실 손상 취약성**: 과실 표면이 부드러워 파지력이 과도할 경우 즉각적인 상품성 훼손(상처, 멍, 과즙 누출)이 발생합니다.\n2. **이탈 방식(Abscission Layer)**: 토마토는 단순히 과실을 당겨서 따면 줄기나 꽃받침이 찢어지거나 열매가 뭉개집니다. 따라서 **꼭지(Peduncle) 위의 탈리층(Abscission Zone)을 꺾거나, 가위/커터로 줄기를 직접 절단**하는 방식이 필수적입니다.\n3. **군집 결실(Cluster/Truss structure)**: 토마토는 보통 화방(Truss) 단위로 4~8개가 뭉쳐 자라므로, 익은 토마토 주변에 덜 익은 초록 토마토, 잎, 줄기, 지지용 와이어(Trellis wire)가 뒤엉켜 있습니다.\n\n따라서 성공적인 토마토 수확을 위해서는 **\"2D 색상 검출\"** 수준을 넘어, **\"정밀 3D 공간지각(Spatial Perception) → 줄기 6D 자세 추정(6-DoF Pose) → 무충돌 궤적 생성(Collision-Free Motion Planning) → 복합 엔드이펙터 절단/파지(Dual-Action Gripping & Cutting)\"**로 이어지는 유기적인 전주기 파이프라인이 요구됩니다.\n\n---\n\n## 2. 전주기 7단계 수확 파이프라인 (End-to-End Pipeline)\n\n```mermaid\nflowchart TD\n    subgraph S1[\"Phase 1: 글로벌 탐색 & 모바일 접근\"]\n        A1[\"원거리 깊이 센싱 (Orbbec Astra Pro / 0.6~4m)\"] --> A2[\"작물 열(Crop Row) 스캔 & 화방(Cluster) 탐색\"]\n        A2 --> A3[\"메카넘 베이스 정렬 (작업 반경 30~50cm 내로 진입)\"]\n    end\n\n    subgraph S2[\"Phase 2: 초근접 3D 공간지각 & 인스턴스 분할\"]\n        B1[\"초근접 RGB-D 캡처 (Intel RealSense D405 / 7~50cm)\"] --> B2[\"YOLOv8/11-Seg 기반 3단 분할 (과실, 꽃받침, 줄기)\"]\n        B2 --> B3[\"숙도 분류 (Red: 익음, Green: 미익음, Pink: 전환기)\"]\n        B3 --> B4[\"3D 포인트 클라우드 De-projection (u,v,d -> X,Y,Z)\"]\n    end\n\n    subgraph S3[\"Phase 3: 기하학적 분석 & 줄기 절단점 도출\"]\n        C1[\"줄기(Peduncle) 포인트 클라우드 추출 & 노이즈 필터링 (SOR)\"] --> C2[\"줄기 3D 스켈레톤(Skeleton) 추출 & 중심선 피팅\"]\n        C2 --> C3[\"과실과 꽃받침 사이의 절단점(Cutting Point) 3D 좌표 특정\"]\n        C3 --> C4[\"접근 벡터(Approach Vector) 및 절단기 6D 자세(Grasp Pose) 계산\"]\n    end\n\n    subgraph S4[\"Phase 4: 좌표계 변환 & Hand-Eye 캘리브레이션\"]\n        D1[\"카메라 광학 좌표계 (Camera Optical Frame)\"] --> D2[\"Hand-Eye 행렬 곱연산 (T_base_cam)\"]\n        D2 --> D3[\"로봇 팔 베이스 좌표계 (Arm Base Frame) 목표 지점 확정\"]\n    end\n\n    subgraph S5[\"Phase 5: 충돌 회피 궤적 계획 & 비주얼 서보잉\"]\n        E1[\"MoveIt 2 / OMPL 기반 주변 장애물(줄기, 와이어) 회피 궤적 계산\"] --> E2[\"엔드이펙터 접근 (Pre-grasp Pose -> Grasp Pose)\"]\n        E2 --> E3[\"실시간 비주얼 서보잉 (PBVS)을 통한 팔 처짐 및 오차 보상\"]\n    end\n\n    subgraph S6[\"Phase 6: 엔드이펙터 수확 실행 (파지 & 절단)\"]\n        F1[\"진공 패드 흡착 또는 소프트 핑거로 과실 안정 고정\"] --> F2[\"전동 전단 커터(Shear Cutter) 구동하여 줄기 순간 절단\"]\n        F2 --> F3[\"과실 분리 확인 (전류 피드백 / 근접 센서)\"]\n    end\n\n    subgraph S7[\"Phase 7: 이송 & 시스템 복귀\"]\n        G1[\"수확 바구니(Basket)로 안전 이송 후 적재\"] --> G2[\"로봇 팔 홈 포지션(Home Pose) 복귀 & 다음 타겟 스캔\"]\n    end\n\n    S1 --> S2 --> S3 --> S4 --> S5 --> S6 --> S7\n```\n\n---\n\n## 3. 공간지각을 위한 핵심 하드웨어 & 센서 레이어\n\n| 센서 / 모듈 | 주 사용처 | 유효 동작 거리 | 핵심 기술적 역할 및 주의점 |\n|---|---|---|---|\n| **Intel RealSense D405** | 초근접 손목/손끝 비전 (Eye-in-Hand 또는 고정) | **7 ~ 50 cm** (초근거리) | **0.1mm급 고정밀 능동 IR 스테레오**.<br/>RGB 센서와 깊이 센서가 단일 ISP로 통합되어 픽셀-깊이 불일치(Misalignment)가 거의 없음. 토마토 꽃받침/줄기 인식의 핵심. |\n| **Orbbec Astra Pro** | 원거리 환경/작물 탐색 (Eye-to-Hand) | **60 ~ 400 cm** (원거리) | **IR 구조광(Structured Light)**.<br/>로봇 베이스가 작물 열에 다가갈 때 화방 전체의 대략적인 위치를 스캔. 60cm 이하에서는 맹점(Blind zone) 발생. |\n| **SO-101 / 5~6축 매니퓰레이터** | 관절 구동 및 3D 이동 | 최대 작업반경 ~35 cm | Feetech 버스 서보 기반 경량 팔.<br/>**자유도 한계(5-DoF)**: 제자리 순수 Yaw 회전 불가(집게가 바닥을 향할 때만 Roll=Yaw 가능). 기구학적 특이점 회피 알고리즘 필수. |\n| **메카넘 휠 베이스** | 전방향 지상 이동 | 실내 평탄면 (온실 레일/바닥) | X축(전진), Y축(게걸음), W축(회전) 독립 제어.<br/>팔의 좁은 작업반경(Workspace)을 보완하기 위해 베이스 이동을 통한 굵은 정렬(Coarse Alignment) 수행. |\n| **NVIDIA Jetson Orin Nano** | 온디바이스 엣지 AI & ROS 2 연산 | 로봇 차체 내장 | GPU 가속(TensorRT) 기반 실시간 YOLOv8 인스턴스 세그멘테이션(30+ FPS) 및 PointCloud 필터링, ROS 2 노드 통신 총괄. |\n\n---\n\n## 4. 학습 모듈 체계 (Curriculum Structure)\n\n사용자가 개념부터 실전 코드까지 단계별로 완벽히 습득할 수 있도록 5개 전문 모듈 문서와 브라우저 학습 포털로 구성됩니다:\n\n```\ndocs/study/\n├── index.html                      # [통합 학습 포털 SPA] 인터랙티브 다이어그램, 24편 논문/12개 오픈소스 검색 뷰어\n├── 00_OVERVIEW_ROADMAP.md          # [현재 문서] 전체 수확 파이프라인, 하드웨어 사양, 학습 로드맵\n├── 01_SPATIAL_PERCEPTION.md        # 3D 비전 공간지각, RGB-D 투영 수학, 점군 필터링, Hand-Eye 캘리브레이션\n├── 02_PAPERS_CATALOG.md            # 24편 핵심 논문 완전 해설집 (연구배경, 수학공식, 실험결과, 토마토 적용점)\n├── 03_OPENSOURCE_GUIDE.md          # 12개 오픈소스 심층 분석, 빌드/설치법, Jetson & ROS 2 연동 코드\n├── 04_END_EFFECTOR_MANIPULATION.md # 6-DoF Grasp Pose 산출, 줄기 스켈레톤 추출, MoveIt 2 충돌회피, 커터 설계\n└── 05_PRACTICE_JETSON_ROS2.md      # 실제 장비(D405 + Astra + SO-101 + Jetson) 기반 실전 엔지니어링 튜토리얼\n```\n\n---\n\n## 5. 단계별 학습 마일스톤 (Study Milestones)\n\n| 단계 | 목표 학습 내용 | 달성 역량 | 관련 문서 |\n|---|---|---|---|\n| **Step 1** | 공간지각의 기초 기하학 및 센서 원리 | 핀홀 카메라 모델, 왜곡 보정, 깊이 맵 De-projection, Hand-Eye 변환 수학 이해 | `01_SPATIAL_PERCEPTION.md` |\n| **Step 2** | 글로벌 SOTA 논문 심층 독해 | 24편의 논문(과실 인식, 3D 점군, 줄기 절단, 엔드이펙터, 필드 시스템) 핵심 아이디어 흡수 | `02_PAPERS_CATALOG.md` |\n| **Step 3** | 핵심 오픈소스 도구 체인 마스터 | YOLOv8-seg, Open3D, MoveIt 2, easy_handeye, LeRobot, AnyGrasp 빌드 및 파이프라인 결합 | `03_OPENSOURCE_GUIDE.md` |\n| **Step 4** | 줄기 절단점 도출 및 파지 기구학 설계 | 스켈레톤 세선화(Thinning), 접근 벡터 계산, 5-DoF/6-DoF 역기구학 풀이, 충돌 회피 구현 | `04_END_EFFECTOR_MANIPULATION.md` |\n| **Step 5** | 실장비 통합 및 엔드투엔드 수확 구현 | RealSense D405 + ROS 2 Humble + Jetson Orin Nano 상에서 원클릭 수확 노드 완성 | `05_PRACTICE_JETSON_ROS2.md` |\n\n다음 문서인 [`01_SPATIAL_PERCEPTION.md`](01_SPATIAL_PERCEPTION.md)에서 공간지각의 핵심 수학 공식과 포인트 클라우드 처리 파이프라인을 다룹니다.\n\n"}, {"id": "01", "file": "01_SPATIAL_PERCEPTION.md", "title": "공간지각(Spatial Perception) 및 3D 비전 기하학 마스터 가이드", "md": "# 공간지각(Spatial Perception) 및 3D 비전 기하학 마스터 가이드\n> **Spatial Perception, 3D Point Cloud Processing, and Hand-Eye Calibration for Robotic Harvesting**\n\n---\n\n## 1. 3D 공간지각의 핵심 수학적 원리 (Camera Geometry)\n\n카메라가 찍은 2차원 화소 평면$(u, v)$과 깊이 값 $d$를 로봇이 실제로 이동할 수 있는 물리적인 3차원 공간 좌표 $(X_c, Y_c, Z_c)$로 변환하는 기하학적 원리를 다룹니다.\n\n```\n       광학 중심 (Optical Center)\n              C (0,0,0)\n             /    |    \\\n            /     |     \\\n           /      |      \\\n          /       |       \\\n      ---[------(u,v)------]---  화상 평면 (Image Plane, z = f)\n        /         |         \\\n       /          |          \\\n      /           |           \\\n     P_w (X, Y, Z)             물리적 타겟 (토마토 또는 줄기)\n```\n\n### 1.1 핀홀 카메라 모델 (Pinhole Camera Model) 및 내부 파라미터 (Intrinsics)\n3차원 카메라 좌표계의 점 $P_c = [X_c, Y_c, Z_c]^T$는 정규화 화상 좌표계 $[x, y, 1]^T = [X_c/Z_c, Y_c/Z_c, 1]^T$를 거쳐 픽셀 좌표 $[u, v, 1]^T$로 투영됩니다:\n\n$$\n\\begin{bmatrix} u \\\\ v \\\\ 1 \\end{bmatrix} = \\frac{1}{Z_c} K \\begin{bmatrix} X_c \\\\ Y_c \\\\ Z_c \\end{bmatrix} = \\frac{1}{Z_c} \\begin{bmatrix} f_x & 0 & c_x \\\\ 0 & f_y & c_y \\\\ 0 & 0 & 1 \\end{bmatrix} \\begin{bmatrix} X_c \\\\ Y_c \\\\ Z_c \\end{bmatrix}\n$$\n\n* $f_x, f_y$: 초점 거리(Focal length in pixels).\n* $c_x, c_y$: 주점(Principal point, 렌즈 광축과 센서가 만나는 중심점 화소 좌표).\n* $K$: 카메라 내부 파라미터 행렬(Intrinsic Matrix).\n\n### 1.2 역투영 (2D De-projection $\\to$ 3D Point)\n깊이 센서로부터 픽셀 $(u, v)$에서의 깊이 거리 $Z_c = d$ (단위: 미터 또는 밀리미터)를 알고 있을 때, 3차원 카메라 좌표 $[X_c, Y_c, Z_c]^T$는 다음과 같이 닫힌 형식(Closed-form)으로 정확히 복원됩니다:\n\n$$\nX_c = \\frac{(u - c_x) \\cdot Z_c}{f_x}, \\quad Y_c = \\frac{(v - c_y) \\cdot Z_c}{f_y}, \\quad Z_c = d\n$$\n\n> **[주의] 렌즈 왜곡(Lens Distortion)**:\n> 초광각 렌즈나 왜곡이 큰 카메라의 경우 브라운-콘라디(Brown-Conrady) 왜곡 계수 $(k_1, k_2, p_1, p_2, k_3)$를 적용하여 먼저 화소 좌표 $(u, v)$를 왜곡 보정(Undistortion)한 후 위 공식을 적용해야 합니다. RealSense D405의 경우 내장 ASIC/SDK가 왜곡 보정된 깊이-컬러 정렬 맵을 제공합니다.\n\n---\n\n## 2. 깊이 카메라 센싱 원리 및 특성 비교 (D405 vs Astra Pro)\n\n토마토 수확 시스템에서 단일 깊이 카메라로는 원거리 탐색과 초근접 절단을 동시에 만족시킬 수 없습니다.\n\n```mermaid\ngraph LR\n    subgraph Far[\"원거리 탐색 (Astra Pro)\"]\n        A1[\"거리: 60cm ~ 400cm\"] --> A2[\"작물 열(Row) 전체 스캔\"]\n        A2 --> A3[\"화방(Cluster) 대략적 3D 위치 산출\"]\n    end\n    subgraph Near[\"초근접 정밀 제어 (D405)\"]\n        B1[\"거리: 7cm ~ 50cm\"] --> B2[\"꽃받침, 줄기(1~3mm) 초정밀 인식\"]\n        B2 --> B3[\"엔드이펙터 6D 파지/절단 좌표 생성\"]\n    end\n```\n\n| 비교 항목 | **Intel RealSense D405** (근거리용) | **Orbbec Astra Pro** (원거리용) |\n|---|---|---|\n| **측정 방식** | 능동 IR 스테레오 (Active IR Stereo) | 구조광 패턴 투영 (Structured Light) |\n| **최적 유효 거리** | **7 cm ~ 50 cm** (초근접) | **60 cm ~ 400 cm** (원거리) |\n| **깊이 단위(Scale)** | **0.1 mm** (0.0001 m) | **1.0 mm** (0.001 m) |\n| **RGB-Depth 정렬** | 단일 ISP 하드웨어 정렬 (완벽 일치) | RGB와 Depth가 물리적으로 분리된 센서 (소프트웨어 정렬 필요) |\n| **태양광 취약성** | 비교적 강함 (태양광 하에서도 스테레오 매칭 가능) | 취약 (외부 태양광 IR 성분에 의해 투영 패턴이 묻힘) |\n| **수확 시의 역할** | **집게가 열매와 줄기를 물고 자르는 순간의 정밀 유도** | **로봇 베이스가 작물 줄기에 접근하는 경로 탐색** |\n\n> **[핵심 함정] Astra Pro 60cm 맹점과 D405 1m 오차**:\n> - Astra Pro는 센서 전방 60cm 이내로 물체가 들어오면 깊이 값이 0(NaN)으로 포화되며, 심한 경우 LDP(레이저 보호장치)가 투광기를 강제로 꺼버립니다.\n> - D405는 1m를 넘어가면 스테레오 기저선(Baseline ~18mm)의 한계로 인해 Z축 오차가 수 센티미터 단위로 급격히 증가합니다.\n> - 따라서 **원거리 주행은 Astra Pro, 최종 진입 및 피킹은 D405**로 핸드오버(Handover)하는 아키텍처가 필수적입니다.\n\n---\n\n## 3. 포인트 클라우드(Point Cloud) 전처리 및 지하학적 피팅 파이프라인\n\nRGB-D 센서로부터 추출된 3D 점군은 온실 환경의 잎, 줄기, 노이즈, 센서 아티팩트가 심하게 섞여 있습니다. 다음 5단계 전처리 파이프라인을 거칩니다:\n\n```mermaid\nflowchart TD\n    P1[\"Raw Point Cloud (카메라 캡처)\"] --> P2[\"1. PassThrough 필터<br/>- Z축 작업영역 절삭 (0.07m < Z < 0.45m)\"]\n    P2 --> P3[\"2. 다운샘플링 (Voxel Grid Filter)<br/>- 2mm 단위 복셀화 (연산량 80% 감축)\"]\n    P3 --> P4[\"3. 통계적 이상치 제거 (SOR Filter)<br/>- 주변 이웃 점과의 거리 표준편차 기반 노이즈 제거\"]\n    P4 --> P5[\"4. RANSAC 구체 피팅 (Sphere Fitting)<br/>- 토마토 과실 중심점 (X_c, Y_c, Z_c) 및 반경 R 추정\"]\n    P4 --> P6[\"5. RANSAC 원통 피팅 (Cylinder Fitting)<br/>- 줄기(Peduncle) 중심축 방향 벡터 추정\"]\n```\n\n### 3.1 통계적 이상치 제거 (SOR: Statistical Outlier Removal)\n각 점 $p_i$에 대해 최근접 $k$개 이웃 점들과의 평균 거리 $d_i$를 구하고, 전체 점군의 평균 $\\mu$와 표준편차 $\\sigma$를 계산합니다:\n\n$$\nd_i = \\frac{1}{k} \\sum_{j=1}^k \\| p_i - p_{i,j} \\|\n$$\n\n거리 $d_i$가 임계값 $\\mu + \\alpha \\cdot \\sigma$를 초과하는 점은 센서 노이즈(먼지, 난반사, 비산 픽셀)로 판정하여 제거합니다 ($\\alpha$는 보통 1.0 ~ 2.0).\n\n### 3.2 토마토 과실: RANSAC 구체 피팅 (Sphere Model)\n토마토 과실 표면 점군 $S = \\{(x_i, y_i, z_i)\\}$에 대해 구의 방정식:\n\n$$\n(x - x_0)^2 + (y - y_0)^2 + (z - z_0)^2 = R^2\n$$\n\nRANSAC 반복을 통해 인라이어(Inlier) 개수를 최대화하는 구의 중심 $(x_0, y_0, z_0)$과 반경 $R$을 찾습니다. 이 구의 중심이 과실의 질량 중심(Centroid)이 됩니다.\n\n### 3.3 줄기(Peduncle): RANSAC 원통 피팅 (Cylinder Model)\n줄기는 반경 $r$과 축 방향 단위 벡터 $\\mathbf{a} = [a_x, a_y, a_z]^T$, 축 상의 한 점 $\\mathbf{p}_0$으로 정의됩니다:\n\n$$\n\\| (\\mathbf{p}_i - \\mathbf{p}_0) \\times \\mathbf{a} \\| = r\n$$\n\n이 원통 모델의 축 방향 벡터 $\\mathbf{a}$는 **엔드이펙터 커터가 줄기에 수직으로 진입(Approach Vector)해야 하는 법선 방향**을 결정합니다.\n\n---\n\n## 4. Hand-Eye 캘리브레이션 및 좌표계 변환 수학\n\n로봇 팔이 카메라가 본 3차원 점을 잡으려면, **카메라 좌표계(Camera Frame) $\\to$ 로봇 팔 베이스 좌표계(Arm Base Frame)**로의 동차 변환 행렬(Homogeneous Transformation Matrix)을 알아야 합니다.\n\n```mermaid\ngraph TD\n    B[\"Arm Base Frame ({B})\"] -->|\"T_B_E (엔코더로 측정 가능)\"| E[\"End-Effector Frame ({E})\"]\n    B -->|\"T_B_C (Hand-Eye로 구해야 하는 미지수)\"| C[\"Camera Frame ({C})\"]\n    E -->|\"T_E_C (Eye-in-Hand 시 미지수)\"| C\n    C -->|\"T_C_T (비전으로 감지한 목표점)\"| T[\"Target Tomato / Stem ({T})\"]\n```\n\n### 4.1 Eye-to-Hand (카메라 고정) vs Eye-in-Hand (팔에 장착)\n\n1. **Eye-to-Hand (카메라가 베이스나 삼각대에 고정)**:\n   - 목표점의 로봇 좌표:\n     $$\n     ^{base}\\mathbf{P}_{target} = {^{base}T_{camera}} \\cdot {^{camera}\\mathbf{P}_{target}}\n     $$\n   - 변환식:\n     $$\n     \\begin{bmatrix} X_{base} \\\\ Y_{base} \\\\ Z_{base} \\\\ 1 \\end{bmatrix} = \\begin{bmatrix} R & \\mathbf{t} \\\\ \\mathbf{0}^T & 1 \\end{bmatrix} \\begin{bmatrix} X_{cam} \\\\ Y_{cam} \\\\ Z_{cam} \\\\ 1 \\end{bmatrix}\n     $$\n   - 특징: 카메라가 흔들리지 않고 넓은 시야를 확보할 수 있으나, 로봇 팔 자체가 카메라 시야를 가리는 오클루전(Self-occlusion)이 발생할 수 있습니다.\n\n2. **Eye-in-Hand (카메라가 팔의 손목/링크에 장착)**:\n   - 목표점의 로봇 좌표:\n     $$\n     ^{base}\\mathbf{P}_{target} = {^{base}T_{gripper}(t)} \\cdot {^{gripper}T_{camera}} \\cdot {^{camera}\\mathbf{P}_{target}}\n     $$\n   - 특징: 집게가 대상에 다가갈수록 시야가 확대되어 초근접 비주얼 서보잉(Visual Servoing)에 유리합니다.\n\n### 4.2 Tsai-Lenz / Park-Martin 캘리브레이션 방정식 ($AX = XB$)\n로봇 팔을 $N$개의 서로 다른 자세로 움직이며 체커보드(또는 집게 끝점)를 측정하면, 인접한 두 자세 간의 변환 행렬 $A_i, B_i$를 얻을 수 있습니다:\n\n$$\nA_i X = X B_i\n$$\n\n여기서:\n- $A_i = {^{base}T_{gripper, i}^{-1}} \\cdot {^{base}T_{gripper, j}}$ (로봇 관절 엔코더로 계산된 팔의 이동)\n- $B_i = {^{cam}T_{marker, i}} \\cdot {^{cam}T_{marker, j}^{-1}}$ (카메라가 관측한 마커의 이동)\n- $X = {^{gripper}T_{cam}}$ (우리가 구하고자 하는 미지의 Hand-Eye 변환 행렬)\n\n회전 벡터(Rodrigues vector) $\\mathbf{P}_A, \\mathbf{P}_B$에 대해:\n\n$$\n\\text{skew}(\\mathbf{P}_A + \\mathbf{P}_B) \\cdot \\mathbf{P}_X = \\mathbf{P}_B - \\mathbf{P}_A\n$$\n\n최소 자승법(SVD)으로 회전 행렬 $R_X$를 먼저 풀고, 이후 이동 벡터 $\\mathbf{t}_X$를 다음과 같이 계산합니다:\n\n$$\n(R_A - I) \\mathbf{t}_X = R_X \\mathbf{t}_B - \\mathbf{t}_A\n$$\n\n> **[실전 지침: 잔차(Residual) 검증]**:\n> Hand-Eye 보정 수학은 입력 데이터에 오차가 심해도 어떻게든 최소자승해를 출력합니다.\n> 따라서 계산된 변환 행렬을 검증 점들에 대입했을 때 **위치 오차 잔차(Position Residual)가 15mm 이하인지 반드시 검증**해야 합니다. 15mm를 넘어서면 집게 폭(약 30~50mm)의 절반을 초과하여 토마토를 헛집게 됩니다.\n\n---\n\n## 5. 파이썬 실전 구현 예제: D405 깊이 투영 & SOR 필터링\n\n```python\nimport numpy as np\nimport open3d as o3d\n\ndef deproject_pixel_to_3d(u: int, v: int, depth_m: float, K: dict) -> np.ndarray:\n    \"\"\"\n    K = {'fx': float, 'fy': float, 'cx': float, 'cy': float}\n    단일 픽셀과 깊이(m)를 3차원 카메라 좌표 (X, Y, Z)로 변환\n    \"\"\"\n    x = (u - K['cx']) * depth_m / K['fx']\n    y = (v - K['cy']) * depth_m / K['fy']\n    z = depth_m\n    return np.array([x, y, z], dtype=np.float32)\n\ndef clean_tomato_pointcloud(pcd: o3d.geometry.PointCloud, \n                            z_min=0.07, z_max=0.50, \n                            voxel_size=0.003, \n                            nb_neighbors=20, std_ratio=1.5) -> o3d.geometry.PointCloud:\n    \"\"\"\n    토마토 수확을 위한 점군 전처리 파이프라인\n    1. 작업영역 크롭 (7cm ~ 50cm)\n    2. 복셀 다운샘플링 (3mm)\n    3. 통계적 이상치 제거 (SOR)\n    \"\"\"\n    # 1. PassThrough (Z축 필터링)\n    bbox = o3d.geometry.AxisAlignedBoundingBox(\n        min_bound=(-0.3, -0.3, z_min),\n        max_bound=(0.3, 0.3, z_max)\n    )\n    pcd_crop = pcd.crop(bbox)\n\n    # 2. Voxel Downsample\n    pcd_down = pcd_crop.voxel_down_sample(voxel_size=voxel_size)\n\n    # 3. Statistical Outlier Removal\n    cl, ind = pcd_down.remove_statistical_outlier(nb_neighbors=nb_neighbors,\n                                                  std_ratio=std_ratio)\n    pcd_clean = pcd_down.select_by_index(ind)\n    return pcd_clean\n```\n\n다음 문서인 [`02_PAPERS_CATALOG.md`](02_PAPERS_CATALOG.md)에서는 전 세계 연구진들이 검증한 **24편의 핵심 수확 로봇 논문**을 집중 분석합니다.\n\n"}, {"id": "02", "file": "02_PAPERS_CATALOG.md", "title": "토마토 수확 로봇 핵심 연구 논문 24편 카탈로그", "md": "# 토마토 수확 로봇 핵심 연구 논문 24편 카탈로그\n> 과실 인식 · 3D 공간지각 · 줄기 절단점 · 엔드이펙터 · 필드 시스템\n\n## ⚠ 검증 기록 (2026-10-24)\n\n이 문서의 첫 판(2026-09-21)은 AI가 만든 목록이라 **24편 중 상당수가 없는 논문이거나, 실재하더라도\n학술지·연도·수치가 틀려 있었다.** 2026-10-24에 한 편씩 검색해 다음 원칙으로 고쳤다.\n\n- **실재하는 논문만 남긴다.** 찾지 못한 항목은 같은 주제의 **확인된 논문으로 바꿨다**(🔁 표시).\n- **수치는 초록·출판사 페이지에서 확인한 것만** 적는다. 확인 못 한 옛 수치는 지웠다.\n  남의 논문(리뷰·인용)을 통해서만 본 수치는 *(2차 인용)* 으로 표시했다 — 원문에서 다시 확인하라.\n- **\"우리 로봇에선\"** 줄은 논문의 주장이 아니라 **이 저장소 관점의 해석**이다.\n\n| 표시 | 뜻 | 편수 |\n|---|---|---|\n| ✅ | 실재 · 서지 정보 맞음(수치만 고침) | 2 |\n| ✏️ | 실재하지만 학술지·연도·저자·수치가 틀렸던 것 → 고침 | 9 |\n| 🔁 | 찾을 수 없어 같은 주제의 실재 논문으로 교체 | 13 |\n\n읽기 전에 **DOI를 열어 원문을 확인**하라(학내망·도서관 원격접속). 방법은 [`06_LEARNING_COURSE.md`](06_LEARNING_COURSE.md) §3.\n\n---\n\n## 목차\n1. [Category A: 과실 검출, 인스턴스 분할 및 숙도 (5편)](#category-a-과실-검출-인스턴스-분할-및-숙도-5편)\n2. [Category B: 3D 공간지각, 점군 처리 및 자세 추정 (5편)](#category-b-3d-공간지각-점군-처리-및-자세-추정-5편)\n3. [Category C: 줄기(Peduncle) 검출 및 절단점 (5편)](#category-c-줄기peduncle-검출-및-절단점-5편)\n4. [Category D: 엔드이펙터와 절단 기구 (4편)](#category-d-엔드이펙터와-절단-기구-4편)\n5. [Category E: 비주얼 서보잉 및 필드 시스템 (5편)](#category-e-비주얼-서보잉-및-필드-시스템-5편)\n\n---\n\n## Category A: 과실 검출, 인스턴스 분할 및 숙도 (5편)\n\n### [Paper 01] Deep Fruit Detection in Orchards ✏️\n- **저자/연도**: Bargoti, S., & Underwood, J. (2017)\n- **학회**: *IEEE ICRA 2017* · arXiv [1610.03677](https://arxiv.org/abs/1610.03677)\n  - 고침: 학술지가 아니라 **학회 논문**이다. 같은 저자의 *JFR* 2017 논문은 제목이 다른 분할 논문이다.\n- **내용**: 과수원 영상(사과·망고·아몬드)에 **Faster R-CNN**을 적용하고, 데이터 증강·학습 영상 수에 따른 성능을 분석했다. 데이터셋(ACFR Orchard Fruit Dataset)을 공개했다.\n- **수치**: F1 — 사과 **0.904**, 망고 **0.908**, 아몬드 **0.775**.\n  - 고침: 옛 판의 \"세 과일 모두 0.90 이상\"은 틀렸다. 아몬드는 영상 한 장에 열매가 1000개가 넘을 만큼 작고 빽빽해서 낮다. \"최초\" 주장, 정밀도 92%, 앵커 1:1은 확인되지 않아 지웠다(과일 딥러닝 검출은 Sa et al., *DeepFruits*, 2016이 더 앞선다).\n- **우리 로봇에선**: **작고 빽빽한 표적일수록 검출기가 약하다**는 숫자 증거다. 줄기는 아몬드보다도 가늘다.\n\n---\n\n### [Paper 02] YOLO-Tomato: A Robust Algorithm for Tomato Detection Based on YOLOv3 ✏️\n- **저자/연도**: Liu, G., Nouaze, J. C., Touko Mbouembe, P. L., & Kim, J. H. (2020)\n- **학술지**: *Sensors*, 20(7), 2145 · DOI [10.3390/s20072145](https://doi.org/10.3390/s20072145) (공개 접근)\n  - 고침: 옛 판의 \"Lawal 2021, *Frontiers in Plant Science*\"는 틀렸다. Lawal(2021, *Scientific Reports*)은 이름이 비슷한 **다른 논문**이다.\n- **내용**: YOLOv3에 **dense 연결**(특징 재사용)을 넣고, 사각 상자 대신 **원형 상자(C-Bbox)**를 써서 NMS의 IoU 계산을 토마토 모양에 맞췄다. 조명 변화·가지/잎 가림·과실 겹침이 대상이다.\n- **수치**: AP 93.91%, F1 96.4% *(2차 인용)*.\n  - 지움: Mish·SPP, \"50% 가림에서 91.2%\"는 확인되지 않았다.\n- **우리 로봇에선**: 모양에 대한 사전지식(토마토는 둥글다)을 검출기 구조에 넣는 예다. 줄기의 사전지식은 \"가늘고 길다\"이다.\n\n---\n\n### [Paper 03] An Efficient Tomato-Detection Method Based on Improved YOLOv4-tiny Model in Complex Environment 🔁\n- **저자/연도**: Touko Mbouembe, P. L., Liu, G., Sikati, J., Kim, S. C., & Kim, J. H. (2023)\n- **학술지**: *Frontiers in Plant Science*, 14, 1150958 · DOI [10.3389/fpls.2023.1150958](https://doi.org/10.3389/fpls.2023.1150958) (공개 접근)\n  - 교체 이유: 옛 판의 \"Liu, Noh & Shu 2020, CEA 178, 105748(숙도 3단계 YOLOv4-Tiny, Jetson 38.5 FPS)\"은 찾을 수 없었다. 같은 모델 계열(YOLOv4-tiny 경량화)의 실재 논문으로 바꿨다. **숙도 분류가 아니라 검출 논문**이다.\n- **내용**: YOLOv4-tiny의 백본을 바꾸고, tiny CSP-SPP 블록과 CARAFE 업샘플링을 넥에 넣었다.\n- **수치**: 정밀도 96.3%, 재현율 95%, F1 95.6%, mAP(IoU 0.5~0.95) 82.8%, 영상당 1.9 ms.\n- **우리 로봇에선**: 젯슨에서 돌릴 경량 검출기를 고를 때 무엇을 바꿔 속도를 얻는지 보는 사례다. 1.9 ms는 데스크톱 GPU 기준이니 젯슨에서는 직접 재야 한다.\n\n---\n\n### [Paper 04] Tomato Fruit Detection and Counting in Greenhouses Using Deep Learning 🔁\n- **저자/연도**: Afonso, M., Fonteijn, H., Fiorentin, F. S., Lensink, D., Mooij, M., Faber, N., Polder, G., & Wehrens, R. (2020)\n- **학술지**: *Frontiers in Plant Science*, 11, 571299 · DOI [10.3389/fpls.2020.571299](https://doi.org/10.3389/fpls.2020.571299) (공개 접근)\n  - 교체 이유: 옛 판의 \"Rong et al. 2022, YOLOv7 숙도 검출, *Front. Plant Sci.* 13, 1024479\"는 찾을 수 없었다.\n- **내용**: 상업 온실에서 **RealSense**로 찍은 영상에 **Mask R-CNN**을 적용해 토마토를 검출하고 셌다. Mask R-CNN이 깊이를 **암묵적으로 배워** 뒤쪽 줄의 열매(배경)를 걸러낸다는 관찰이 있다. 데이터셋 = *Rob2Pheno Annotated Tomato Image Dataset*(4TU.ResearchData).\n- **수치**: 원문 표에서 직접 확인할 것(초록에는 \"기존 연구와 같거나 낫다\"로만 나온다).\n- **우리 로봇에선**: **같은 계열 카메라(RealSense) + 실제 온실**이라 가장 가까운 비교 대상이다. \"앞줄 열매만 고르기\"는 깊이 거절(`detect_node`)과 같은 문제다.\n\n---\n\n### [Paper 05] Laboro Tomato (데이터셋) ✏️\n- **출처**: Laboro.AI, GitHub [laboroai/LaboroTomato](https://github.com/laboroai/LaboroTomato) · 미러 [dataset-ninja/laboro-tomato](https://github.com/dataset-ninja/laboro-tomato)\n  - 고침: **논문이 아니라 데이터셋**이다. 옛 판의 \"Wang et al. 2022, arXiv:2009.05244\"는 전혀 다른 논문(적대적 비디오 방어)의 번호였다. 벤치마크 점수 주장도 지웠다.\n- **내용**: 온실 토마토 영상, **인스턴스 분할 마스크**. 6클래스 = 크기 2종(일반 `b_`, 방울 `l_`) × 숙도 3단계(빨간 면적 90% 이상 = 완숙 / 30~89% = 반숙 / 0~30% = 미숙).\n- **규모**: 804장, 10,610개체, 학습 643 / 시험 161 *(Dataset Ninja 기준)*.\n- **라이선스**: CC BY-NC-SA 4.0(비상업) *(Dataset Ninja 기준, 원 저장소에서 다시 확인)*.\n- **우리 로봇에선**: 사전학습용이다. **줄기 클래스는 없으니** 줄기 분할에는 직접 라벨링이 필요하다.\n\n---\n\n## Category B: 3D 공간지각, 점군 처리 및 자세 추정 (5편)\n\n### [Paper 06] Fruit Detection, Segmentation and 3D Visualisation of Environments in Apple Orchards (DaSNet-V2) ✏️\n- **저자/연도**: Kang, H., & Chen, C. (2020)\n- **학술지**: *Computers and Electronics in Agriculture*, 171, 105302 · DOI [10.1016/j.compag.2020.105302](https://doi.org/10.1016/j.compag.2020.105302) · arXiv [1911.12889](https://arxiv.org/abs/1911.12889)\n  - 고침: 옛 판의 \"*IEEE Trans. Cybernetics* 51(12)\"는 틀렸다. **사과 과수원** 논문이고 토마토는 없다. \"6D 포즈 추정\", \"형태 완성 모듈\", \"중심 오차 8.2 mm\"는 이 논문에 없다.\n- **내용**: 원스테이지 네트워크 하나로 과실 검출 + 과실 인스턴스 분할 + **가지 의미 분할**을 같이 한다. 경량 백본 LW-net을 쓰고, RGB-D로 결과를 3D로 보여 준다.\n- **수치**: (LW-net) 검출 F1 0.844, 과실 분할 mIoU 0.858, 가지 분할 mIoU 0.795. GTX-1080Ti 30 ms, Jetson TX2 265 ms.\n- **우리 로봇에선**: 과실과 **가지를 같이** 분할하는 구조다. 줄기·와이어를 장애물로 보려면 이렇게 해야 한다. TX2 265 ms는 젯슨 예산을 가늠하는 기준이 된다.\n\n---\n\n### [Paper 07] Development and Evaluation of Automated Localisation and Reconstruction of All Fruits on Tomato Plants in a Greenhouse Based on Multi-View Perception and 3D Multi-Object Tracking 🔁\n- **저자/연도**: Rapado-Rincón, D., van Henten, E. J., & Kootstra, G. (2023)\n- **학술지**: *Biosystems Engineering*, 231, 78–91 · DOI [10.1016/j.biosystemseng.2023.06.003](https://doi.org/10.1016/j.biosystemseng.2023.06.003) (공개 접근, CC BY) · arXiv [2211.02760](https://arxiv.org/abs/2211.02760)\n  - 교체 이유: 옛 판의 \"Sun et al. 2020, *Biosystems Eng.* 198(HSV + 유클리드 군집 + RANSAC 구 피팅)\"은 찾을 수 없었다.\n- **내용**: 여러 시점에서 본 토마토를 **3D 다중 객체 추적**으로 같은 열매끼리 묶어, 가림을 넘어 한 그루의 열매 전부를 3D로 복원한다. 검출 단계는 Mask R-CNN 마스크로 점군을 잘라 열매마다 **구(sphere)를 피팅해 중심**을 잡는다(후속 MinkSORT 논문의 설명).\n- **수치**: 열매 수 추정 최대 오차 5.08%, 추적 정확도 최대 71.47%.\n- **우리 로봇에선**: 한 장으로 안 보이면 **여러 장으로 보고 묶는다**는 접근이다. `space_map`의 토마토 찾기가 같은 문제를 원거리에서 푼다.\n\n---\n\n### [Paper 08] Guava Detection and Pose Estimation Using a Low-Cost RGB-D Sensor in the Field 🔁\n- **저자/연도**: Lin, G., Tang, Y., Zou, X., Xiong, J., & Li, J. (2019)\n- **학술지**: *Sensors*, 19(2), 428 · DOI [10.3390/s19020428](https://doi.org/10.3390/s19020428) (공개 접근)\n  - 교체 이유: 같은 저자의 \"*CEA* 176, 105654(PointNet++ 기반 구아바/토마토)\"는 찾을 수 없었다. 실재하는 이쪽이 내용상 가장 가깝다.\n- **내용**: FCN으로 RGB를 과실·가지로 분할 → 점군에서 **유클리드 군집**으로 열매를 하나씩 분리 → 가지를 **3D 선분**으로 재구성 → 열매 중심과 가장 가까운 가지로 **열매 자세**를 정한다(Kinect v2, 437장).\n- **수치**: 정밀도 0.983, 재현율 0.948, **자세 오차 23.43° ± 14.18°**, 열매당 0.565 s.\n- **우리 로봇에선**: 검출은 잘 돼도 **방향 추정은 20°대로 거칠다**는 실측이다. 줄기 축 추정(M4)의 불확실성을 생각할 때 기준점이 된다.\n\n---\n\n### [Paper 09] Tomato Harvesting Robotic System Based on Deep-ToMaToS: Deep Learning Network Using Transformation Loss for 6D Pose Estimation of Maturity Classified Tomatoes with Side-Stem ✏️\n- **저자/연도**: Kim, J., Pyo, H., Jang, I., Kang, J., Ju, B.-K., & Ko, K.-E. (2022)\n- **학술지**: *Computers and Electronics in Agriculture*, 201, 107300\n  - 고침: 옛 판의 \"*IEEE Access* 11, 2023\"은 틀렸다. \"언리얼 엔진 합성 10만 장\", \"ADD 84.6%\"는 확인되지 않아 지웠다.\n- **내용**: 토마토의 **숙도 3단계 분류**와 **6D 자세(3D 위치 + 3D 회전)**를 한 네트워크에서 동시에 추정한다. 곁줄기(side-stem)가 붙은 토마토가 대상이다. 변환 손실(transformation loss)을 쓴다.\n- **수치**: 원문에서 확인할 것.\n- **우리 로봇에선**: **국내 연구진**의 토마토 6D 자세 논문이라 저자에게 물어볼 수도 있다. 자세를 학습으로 바로 내는 방식이라, 기하로 푸는 `stem_cut`과 비교해 볼 만하다.\n\n---\n\n### [Paper 10] 3D Pose Estimation of Tomato Peduncle Nodes Using Deep Keypoint Detection and Point Cloud 🔁\n- **저자/연도**: Ci, J., Wang, X., Rapado-Rincón, D., Burusa, A. K., & Kootstra, G. (2024)\n- **학술지**: *Biosystems Engineering*, 243, 57–69 · arXiv [2311.04699](https://arxiv.org/abs/2311.04699)\n  - 교체 이유: 옛 판의 \"Magrini et al. 2020, *Autonomous Robots* 44(6)(스테레오 + EKF 추적)\"은 찾을 수 없었다.\n- **내용**: RGB에서 꼭지 마디의 **해부학적 키포인트 4개**를 검출하고, 점군 정보를 합쳐 꼭지와 **주줄기 사이의 3D 각도**를 낸다.\n- **수치**: 검출 AP@0.5 0.96, 키포인트 PDJ@0.2 94.31%, 각도 MAE 위쪽 11.38° / 아래쪽 9.93°.\n- **우리 로봇에선**: \"2D에서 점을 고르고 → 깊이로 3D를 만든다\"(06 과정 M3→M1)를 **줄기에** 그대로 적용한 예다. 각도 오차 10°가 현재 수준이다.\n\n---\n\n## Category C: 줄기(Peduncle) 검출 및 절단점 (5편)\n\n### [Paper 11] Fast Detection of Tomato Peduncle Using Point Cloud with a Harvesting Robot 🔁\n- **저자/연도**: Yoshida, T., Fukao, T., & Hasegawa, T. (2018)\n- **학술지**: *Journal of Robotics and Mechatronics*, 30(2), 180–186 · DOI [10.20965/jrm.2018.p0180](https://doi.org/10.20965/jrm.2018.p0180) (공개 접근)\n  - 교체 이유: 옛 판의 \"Chen et al. 2021, *CEA* 182, 106008(Mask R-CNN + 꽃받침 위 10~15 mm, 오차 4.7 mm)\"은 찾을 수 없었다.\n- **내용**: RGB-D 점군에서 꼭지를 찾는다. 계산을 줄이려고 **두 해상도의 복셀화**를 하고, 꼭지가 만족해야 할 **세 조건으로 에너지 함수**를 세워 최소화해 절단점을 정한다. 실제 농장에서 꼭지를 잘라 수확했다(Ritsumeikan University · Denso).\n- **우리 로봇에선**: **토마토 꼭지 절단점을 RGB-D 점군에서 찾는**, 바로 우리 문제다. 06 과정 M4의 중심 논문이다.\n\n---\n\n### [Paper 12] Cutting Point Detection Using a Robot with Point Clouds for Tomato Harvesting 🔁\n- **저자/연도**: Yoshida, T., Fukao, T., & Hasegawa, T. (2020)\n- **학술지**: *Journal of Robotics and Mechatronics*, 32(2), 437–444 (공개 접근, fujipress.jp)\n  - 교체 이유: 옛 판의 \"Rong et al. 2023, *CEA* 205, 107611(Zhang-Suen 골격선)\"은 찾을 수 없었다.\n- **내용**: Paper 11의 후속으로 절단점 검출을 다룬다. *(초록만 확인했다 — 원문을 읽고 이 칸을 채울 것.)*\n- **우리 로봇에선**: 11과 이어 읽으면 2년 동안 무엇을 고쳤는지가 보인다.\n\n---\n\n### [Paper 13] A Peduncle Detection Method of Tomato for Autonomous Harvesting 🔁\n- **저자/연도**: Rong, J., Dai, G., & Wang, P. (2021 온라인, 2022 권호)\n- **학술지**: *Complex & Intelligent Systems*, 8(4), 2955–2969 · DOI [10.1007/s40747-021-00522-7](https://doi.org/10.1007/s40747-021-00522-7)\n  - 교체 이유: 옛 판의 \"Li et al. 2021, *RA-L* 6(4)(PointNet++ 줄기 국소좌표계)\"는 찾을 수 없었다.\n- **내용**: 멀리서는 **YOLOv4-Tiny**로 찾고, 가까이서는 **YOLACT++**로 꼭지를 분할한다. 꼭지 마스크에 **최소자승 곡선을 피팅**해 곡선 위 키포인트 3개를 잡고, 기하 모델로 꼭지 자세를 낸다.\n- **수치**: YOLACT++ mAP 73.1, 프레임당 0.109 s. 30회 시험 평균 오차 yaw 4.98°, pitch 4.75°.\n- **우리 로봇에선**: **2D 마스크에서 모양을 먼저 잡고 깊이를 붙인다** — `stem_cut`과 같은 방향이다. \"원거리 검출 → 근거리 분할\" 두 단계는 Astra → D405 역할 분담과 같다.\n\n---\n\n### [Paper 14] Peduncle Detection of Sweet Pepper for Autonomous Crop Harvesting — Combined Color and 3-D Information 🔁\n- **저자/연도**: Sa, I., Lehnert, C., et al. (2017)\n- **학술지**: *IEEE Robotics and Automation Letters*, 2(2), 765–772 · arXiv [1701.08608](https://arxiv.org/abs/1701.08608)\n  - 교체 이유: 옛 판의 \"Taqi et al. 2023, *Front. Plant Sci.* 14, 1148821\"은 찾을 수 없었다. 이 논문으로 바꿨다.\n- **내용**: RGB-D의 **색 + 기하** 특징으로 지도학습해 3D에서 꼭지를 찾는다. 주석 단 3D 데이터를 공개했다.\n- **수치**: 노지 파프리카에서 꼭지 검출 AUC 0.71.\n- **우리 로봇에선**: 06 과정 M3의 **중심 논문**이다. AUC 0.71은 \"꼭지 찾기는 열매 찾기보다 훨씬 어렵다\"는 기준선이다.\n\n---\n\n### [Paper 15] Collision-Free Path Planning for a Guava-Harvesting Robot Based on Recurrent Deep Reinforcement Learning 🔁\n- **저자/연도**: Lin, G., Zhu, L., Li, J., Zou, X., & Tang, Y. (2021)\n- **학술지**: *Computers and Electronics in Agriculture*, 188, 106350 · DOI [10.1016/j.compag.2021.106350](https://doi.org/10.1016/j.compag.2021.106350)\n  - 교체 이유: 옛 판의 \"Luo et al. 2018, *IJABE* 11(6)(줄기 인식 + RRT*)\"는 찾을 수 없었다.\n- **내용**: 순환신경망 + **DDPG**(강화학습)로 팔의 무충돌 경로를 빠르게 계획한다. Paper 08(같은 연구실)의 인식 결과와 이어진다.\n- **수치**: 성공률 90.9% *(2차 인용)*.\n- **우리 로봇에선**: 고전적 계획기(RRT·MoveIt)와 학습 계획기를 비교하는 자리다. 06 과정 M5 이후에 읽는다.\n\n---\n\n## Category D: 엔드이펙터와 절단 기구 (4편)\n\n### [Paper 16] Dual-Arm Cooperation and Implementing for Robotic Harvesting Tomato Using Binocular Vision ✏️\n- **저자/연도**: Ling, X., Zhao, Y., Gong, L., Liu, C., & Wang, T. (2019)\n- **학술지**: *Robotics and Autonomous Systems*, 114, 134–143\n  - 고침: 옛 판의 \"*CEA* 162\", \"9.2초, 91.8%, 손상 0%\", \"실리콘 손가락 + 회전 가위\"는 확인되지 않거나 틀렸다.\n- **내용**: 양팔 협업이다. 쌍안 카메라로 위치를 잡고, 한 팔이 **진공컵으로 잡고** 다른 팔이 **넓은 범위 절단**을 한다.\n- **수치**: 성공률 87.5%, 사이클 30초 이상 *(2차 인용, 리뷰 논문 기준)*.\n- **우리 로봇에선**: 잡는 팔과 자르는 팔을 나누면 성공률은 오르지만 느리다. 팔이 하나인 우리는 **잡기 + 자르기를 한 손끝에** 넣어야 한다(Paper 18).\n\n---\n\n### [Paper 17] End-Effectors for Tomato Harvesting Robot 🔁\n- **저자/연도**: Monta, M., Kondo, N., & Ting, K. C. (1998)\n- **학술지**: *Artificial Intelligence Review*, 12, 11–25 · DOI [10.1023/A:1006595416751](https://doi.org/10.1023/A:1006595416751)\n  - 교체 이유: 옛 판의 \"Wang et al. 2019, *Trans. ASABE* 62(6)(진공 벨로우즈 + 3지 소프트)\"는 찾을 수 없었다. **흡착 + 손가락** 조합의 원조 격인 실재 논문으로 바꿨다.\n- **내용**: 평행판 손가락 2개 + **흡착 패드**. 흡착으로 열매를 떼어 끌어온 뒤 손가락이 꼭지 마디에서 분리한다. 첫 시제품은 **꼭지가 짧은 열매**에서 실패했다(손가락이 잡기 전에 패드에서 떨어짐). 두 번째 시제품은 열매 위치·패드 압력 센서를 더해 무손상 수확에 성공했다.\n- **우리 로봇에선**: \"패드에서 떨어진다\"처럼 **실패 모드를 적어 둔 논문**이다. 우리 잡기 실패 기록(개발일지 9/11)과 나란히 읽을 것.\n\n---\n\n### [Paper 18] Linkage Integrated Fin Ray Gripper Capable of Safe Adaptive Grasping for Tomato Harvesting 🔁\n- **저자/연도**: 아주대학교 연구진 (2025) — *저자명은 원문에서 확인*\n- **학술지**: *Computers and Electronics in Agriculture*, 232 (2025년 5월)\n  - 교체 이유: 옛 판의 \"Ji et al. 2021, *RA-L* 6(3)(Fin-Ray + 내장 가위, 450 g)\"은 찾을 수 없었다. 같은 아이디어(**추가 구동기 없이 쥐면 잘린다**)의 실재 논문이다.\n- **내용**: **Fin Ray** 손가락이 유연하게 휘는 움직임이 **링크를 밀어 줄기를 자른다** — 잡기와 자르기가 한 동작이다. 의사강체 모델(pseudo-rigid body model)로 파지력을 분산해 과실 손상을 막고, 링크는 토크와 회전각을 고려해 설계했다.\n- **수치**: 최대 절단력 13.9 N, 실험실에서 지름 73 mm까지의 실제 토마토 수확.\n- **우리 로봇에선**: SO-101 집게 하나로 잡고 자르려면 가장 직접적인 참고 설계다. **국내 연구진**이다.\n\n---\n\n### [Paper 19] An Overview of End Effectors in Agricultural Robotic Harvesting Systems 🔁\n- **저자/연도**: Vrochidou, E., Tsakalidou, V. N., Kalathas, I., Gkrimpizis, T., Pachidis, T., & Kaburlasos, V. G. (2022)\n- **학술지**: *Agriculture*, 12(8), 1240 · DOI [10.3390/agriculture12081240](https://doi.org/10.3390/agriculture12081240) (공개 접근)\n  - 교체 이유: 옛 판의 \"Sepúlveda et al. 2020, *Agronomy* 10(9), 1373(절단 방식별 에너지 순위)\"은 찾을 수 없었다.\n- **내용**: 수확용 엔드이펙터 개관이다. 분리 방식·엔드이펙터 종류·부가 센서를 정리하고, 작물별로 엔드이펙터를 고르는 성능 지표를 제시한다. **접촉 파지형 집게가 가장 흔하고**, 연구는 토마토·사과·파프리카에 몰려 있다.\n- **우리 로봇에선**: D 카테고리를 읽기 전에 지도로 먼저 본다.\n\n---\n\n## Category E: 비주얼 서보잉 및 필드 시스템 (5편)\n\n### [Paper 20] Autonomous Sweet Pepper Harvesting for Protected Cropping Systems (Harvey) ✅\n- **저자/연도**: Lehnert, C., et al. (2017)\n- **학술지**: *IEEE Robotics and Automation Letters*, 2(2), 872–879 · arXiv [1706.02023](https://arxiv.org/abs/1706.02023)\n- **내용**: QUT의 파프리카 수확 로봇 Harvey. **흡착으로 잡고 → 커터로 자르는** 엔드이펙터, RGB-D 인식(Paper 14와 이어짐), 두 품종으로 온실 시험.\n- **수치**: 수확 성공률 — 작물을 손대지 않음 **46%**, 잎을 정리함 **58%**. 유리한 품종에서는 **90%를 떼어 냈다** → 저자들은 파지를 개선하면 크게 오른다고 본다.\n  - 고침: 옛 판의 \"76%, 42초\"는 이 논문의 숫자가 아니다(후속 *JFR* 2020 논문의 것으로 보이나 확인하지 못했다). \"실패의 60%가 도달 불가\"도 확인되지 않아 지웠다.\n- **우리 로봇에선**: 병목이 **인식이 아니라 잡기**였다는 실측이다. 우리 잡기 기록(48회 2성공 → 3회 3성공)과 같은 결론이다.\n\n---\n\n### [Paper 21] Harvesting Robots for High-Value Crops: State-of-the-Art Review and Challenges Ahead ✏️\n- **저자/연도**: Bac, C. W., van Henten, E. J., Hemming, J., & Edan, Y. (2014)\n- **학술지**: *Journal of Field Robotics*, 31(6), 888–911\n  - 고침: 옛 판의 \"*CEA* 104, 125–141\"은 틀렸다. \"사이클 타임 비율(탐색 15% · 이동 45% …)\"과 \"상용화 기준 85% / 15초 / 5%\"는 확인되지 않아 지웠다.\n- **내용**: 30년간의 수확 로봇 50대를 정량 비교한 리뷰다.\n- **수치**: 평균 수확 성공률 **약 66%**, 30년 동안 **성능이 오르지 않았고**, 50대 중 **상용화된 것이 없다**.\n- **제안한 네 과제**: 작업 단순화(작물을 로봇에 맞추기) · 로봇 개선 · 요구사항 정의와 성능 측정 · 실제 도입을 위한 추가 요구.\n- **우리 로봇에선**: \"작물을 로봇에 맞춘다\"(잎 정리·재배 방식)도 정당한 해법이라는 근거다. 데모 무대 설계에 쓸 수 있다.\n\n---\n\n### [Paper 22] Design of an Eye-in-Hand Sensing and Servo Control Framework for Harvesting Robotics in Dense Vegetation ✏️\n- **저자/연도**: Barth, R., Hemming, J., & van Henten, E. J. (2016)\n- **학술지**: *Biosystems Engineering*, 146, 71–84 — EurAgEng Outstanding Paper Award 2018\n  - 고침: 제목이 달랐다. \"안착 오차 18.4 → 2.1 mm(88% 감소)\"는 확인되지 않아 지웠다.\n- **내용**: 빽빽한 잎 속 수확 로봇은 **여러 시점과 실시간 궤적 수정**이 필요하다는 전제로, 손목 카메라(eye-in-hand) 인식·제어 소프트웨어 틀을 **ROS 노드**들로 설계했다(작업 제어, 팔 동작, 영상 획득, 과실 검출, 시각 서보, SLAM). SWEEPER(Paper 23)의 기반이다.\n- **우리 로봇에선**: `ros2/` 계통에서 노드를 나누는 방식과 비교해 읽을 것. 시각 서보가 시스템의 어디에 끼는지 보인다.\n\n---\n\n### [Paper 23] Development of a Sweet Pepper Harvesting Robot (SWEEPER) ✅\n- **저자/연도**: Arad, B., et al. (2020)\n- **학술지**: *Journal of Field Robotics*, 37(6), 1027–1039\n- **내용**: EU 과제 SWEEPER의 통합 설계와 상업 온실 실증(4주, 열매 262개, 여러 품종·재배 조건).\n- **수치**: 성공률 — 가장 유리한 작물 조건 **61%**, 현재 재배 조건 **18%**. 평균 사이클 **24초**, 그중 약 50%가 물류(열매 배출 7.8 s, 차체 이동 4.7 s). 팔을 빠르게 돌리면 실험실에서 15초까지 줄었다.\n  - 고침: 옛 판의 \"조건 개선 시 84%\"와 \"잎을 걷어내는 능동 인식\"은 확인되지 않아 지웠다.\n- **우리 로봇에선**: **같은 로봇이 작물 조건만으로 18% ↔ 61%**가 된다. 시연 결과를 말할 때 조건을 같이 적어야 하는 이유다.\n\n---\n\n### [Paper 24] Design, Integration, and Field Evaluation of a Robotic Apple Harvester ✏️\n- **저자/연도**: Silwal, A., et al. (2017)\n- **학술지**: *Journal of Field Robotics*, 34(6), 1140–1159\n  - 고침: 옛 판의 \"*Trans. ASABE* 60(4)\", \"사이클 7.2초\", \"글로벌 + 로컬 2카메라 구조\"는 확인되지 않거나 틀렸다.\n- **내용**: 7자유도 사과 수확기의 설계·통합·과수원 시험. 작업 단계마다 시간을 따로 재서 어디를 줄일지 분석했다.\n- **수치**: 150개 시도 중 **127개 성공(84%)**, 열매당 평균 **6.0초**, 영상 위치 추정 1.5초.\n- **우리 로봇에선**: **단계별 시간 분해**는 우리도 바로 할 수 있다(찾기 · 다가가기 · 잡기 · 자르기 · 돌아오기). 어디가 느린지 숫자로 말하게 된다.\n\n---\n\n다음 문서인 [`03_OPENSOURCE_GUIDE.md`](03_OPENSOURCE_GUIDE.md)에서는 오픈소스를 다룬다.\n"}, {"id": "03", "file": "03_OPENSOURCE_GUIDE.md", "title": "토마토 수확 로봇을 위한 핵심 오픈소스 12선 및 실무 연동 가이드", "md": "# 토마토 수확 로봇을 위한 핵심 오픈소스 12선 및 실무 연동 가이드\n> **12 Essential Open-Source Projects for Agricultural Robotics, 3D Vision, and Robotic Manipulation**\n\n본 문서는 토마토 수확 시스템 구축에 즉시 활용할 수 있는 **12개의 최고 수준 오픈소스 라이브러리 및 데이터셋**을 엄선하여 소개합니다. 각 프로젝트의 기술 스택, 설치 방법, 그리고 현재 프로젝트(`Intel RealSense D405`, `Orbbec Astra Pro`, `SO-101 팔`, `Jetson Orin Nano`, `ROS 2 Humble`)와의 실전 연동 방안 및 예제 코드를 제공합니다.\n\n---\n\n## 오픈소스 프로젝트 목록 한눈에 보기\n\n| # | 프로젝트명 | 주 용도 | 기술 스택 / 라이선스 |\n|---|---|---|---|\n| **01** | [Laboro Tomato](#01-laboro-tomato-dataset--benchmark) | 온실 토마토 인스턴스 세그멘테이션 데이터셋 | PyTorch, COCO Format / Apache-2.0 |\n| **02** | [Ultralytics YOLOv8/11](#02-ultralytics-yolov8--yolo11) | 과실/줄기 실시간 인스턴스 분할 및 숙도 분류 | Python, PyTorch, TensorRT / AGPL-3.0 |\n| **03** | [Open3D](#03-open3d) | 3D 포인트 클라우드 전처리, RANSAC 피팅, ICP 정렬 | C++, Python / MIT |\n| **04** | [AnyGrasp](#04-anygrasp--graspnet-1billion) | 비정형 물체 대상 6-DoF 파지(Grasp) 자세 추정 | PyTorch, CUDA / Non-commercial/Custom |\n| **05** | [Contact-GraspNet](#05-contact-graspnet-nvidia) | 밀집 점군 기반 6자유도 접촉면 파지 생성 신경망 | TensorFlow 2, Python / CC-BY-NC-SA |\n| **06** | [MoveIt 2](#06-moveit-2) | ROS 2 모션 플래닝, 충돌 회피, OMPL 기구학 솔버 | ROS 2, C++, Python / BSD-3-Clause |\n| **07** | [easy_handeye](#07-easy_handeye--moveit_calibration) | Eye-in-Hand / Eye-to-Hand 캘리브레이션 GUI 툴 | ROS 2, Python, OpenCV / LGPL |\n| **08** | [ViSP](#08-visp-visual-servoing-platform) | 실시간 비주얼 서보잉(IBVS/PBVS) 라이브러리 | C++, Python / GPL-2.0 |\n| **09** | [Hugging Face LeRobot](#09-hugging-face-lerobot) | SO-100/SO-101 로봇 팔 모작 학습 및 텔레오퍼레이션 | Python, PyTorch, Feetech / Apache-2.0 |\n| **10** | [Tomato-Harvesting-Robot](#10-tomato-harvesting-robot) | ROS 기반 토마토 깊이 추정 및 수확 레퍼런스 노드 | ROS 1/2, Python, RealSense / MIT |\n| **11** | [NVIDIA Isaac Lab](#11-nvidia-isaac-lab--isaac-sim) | 농업 환경 물리 시뮬레이션 및 합성 점군 생성 | Omniverse, PhysX, PyTorch / BSD-3-Clause |\n| **12** | [PointNeXt](#12-pointnext-pointnet-v2) | 3D 점군 기반 줄기/과실 세부 세그멘테이션 백본 | PyTorch, CUDA / MIT |\n\n---\n\n## 01. Laboro Tomato Dataset & Benchmark\n- **저장소**: [https://github.com/LaboroAI/Laboro-Tomato](https://github.com/LaboroAI/Laboro-Tomato)\n- **개요**: 상업용 온실에서 직접 촬영한 방울토마토 및 일반 토마토의 고해상도 인스턴스 세그멘테이션 데이터셋입니다.\n- **주요 특징**:\n  - 크기별(`tomato_regular`, `tomato_cherry`) 및 숙도별(`fully_ripened`, `half_ripened`, `green`) 라벨링.\n  - COCO 데이터 형식의 정밀한 폴리곤 마스크(Polygon Mask) 제공.\n- **설치 및 다운로드**:\n  ```bash\n  git clone https://github.com/LaboroAI/Laboro-Tomato.git\n  cd Laboro-Tomato\n  # 스크립트를 통해 원본 이미지 및 COCO json 다운로드\n  python download.py\n  ```\n- **우리 프로젝트 적용점**:\n  - `src/tomato_picker/vision/`의 색상 검출 모델을 딥러닝 기반 세그멘테이션 모델로 고도화할 때 베이스라인 훈련 데이터셋으로 사용.\n\n---\n\n## 02. Ultralytics YOLOv8 / YOLO11\n- **저장소**: [https://github.com/ultralytics/ultralytics](https://github.com/ultralytics/ultralytics)\n- **개요**: 실시간 컴퓨터 비전 분야의 디팩토 표준 라이브러리로, 단일 파이프라인에서 바운딩 박스 검출과 화소 단위 인스턴스 세그멘테이션(`yolov8n-seg.pt`)을 초고속으로 수행합니다.\n- **설치**:\n  ```bash\n  pip install ultralytics\n  # Jetson Orin Nano TensorRT 가속 변환\n  yolo export model=yolov8n-seg.pt format=engine device=0 half=True\n  ```\n- **실전 파이썬 예제 (토마토 마스크 & 중심점 추출)**:\n  ```python\n  from ultralytics import YOLO\n  import cv2\n  import numpy as np\n\n  model = YOLO(\"yolov8n-seg.pt\") # 또는 파인튜닝된 tomato-seg.pt\n  results = model.predict(source=\"camera_frame.jpg\", conf=0.6, classes=[0]) # 과실 클래스\n\n  for r in results:\n      if r.masks is not None:\n          for mask, box in zip(r.masks.xy, r.boxes):\n              # 마스크 중심점(Centroid) 계산\n              pts = np.int32([mask])\n              M = cv2.moments(pts)\n              if M[\"m00\"] != 0:\n                  cx = int(M[\"m10\"] / M[\"m00\"])\n                  cy = int(M[\"m01\"] / M[\"m00\"])\n                  print(f\"토마토 중심 픽셀: ({cx}, {cy})\")\n  ```\n\n---\n\n## 03. Open3D\n- **저장소**: [https://github.com/isl-org/Open3D](https://github.com/isl-org/Open3D)\n- **개요**: 3D 데이터(Point Cloud, Mesh) 처리를 위한 현대적 오픈소스 라이브러리입니다. C++ 및 Python API를 제공합니다.\n- **주요 기능**:\n  - D405 / Astra 깊이 영상 $\\to$ 3D 점군 변환.\n  - Voxel Grid 다운샘플링, 통계적 이상치 제거(SOR), 법선 벡터 계산.\n  - RANSAC 구체/원통 피팅을 통한 토마토 3D 중심점 및 줄기 축 벡터 도출.\n- **설치**:\n  ```bash\n  pip install open3d\n  ```\n- **실전 예제 (토마토 3D 구체 피팅)**:\n  ```python\n  import open3d as o3d\n  import numpy as np\n\n  # RGBD 이미지에서 점군 생성\n  rgbd = o3d.geometry.RGBDImage.create_from_color_and_depth(\n      color_image, depth_image, depth_scale=10000.0, depth_trunc=0.5, convert_rgb_to_intensity=False)\n  pcd = o3d.geometry.PointCloud.create_from_rgbd_image(rgbd, intrinsic)\n\n  # 통계적 노이즈 제거\n  clean_pcd, _ = pcd.remove_statistical_outlier(nb_neighbors=20, std_ratio=1.5)\n  ```\n\n---\n\n## 04. AnyGrasp & GraspNet-1Billion\n- **저장소**: [https://github.com/graspnet/anygrasp_sdk](https://github.com/graspnet/anygrasp_sdk) / [https://github.com/graspnet/graspnet-baseline](https://github.com/graspnet/graspnet-baseline)\n- **개요**: 대규모 실제 3D 점군 데이터셋(GraspNet-1B) 기반으로 훈련된 6자유도(6-DoF) 병렬 조(Parallel-jaw) 그리퍼 파지 자세 생성 네트워크입니다.\n- **주요 기능**:\n  - 입력된 RGB-D 포인트 클라우드에서 충돌이 없으면서 파지 성공 확률이 가장 높은 엔드이펙터의 3D 위치 $[X, Y, Z]$ 및 회전 행렬 $R_{3\\times3}$, 파지 폭(Grasp width)을 동시 출력.\n- **실무 적용점**:\n  - 온실 환경의 얽혀 있는 토마토 화방에서 어떤 각도로 집게를 넣어야 주변 줄기와 충돌하지 않는지 최적의 그리퍼 진입 방향을 계산할 때 활용.\n\n---\n\n## 05. Contact-GraspNet (NVIDIA)\n- **저장소**: [https://github.com/NVlabs/contact_graspnet](https://github.com/NVlabs/contact_graspnet)\n- **개요**: 포인트 클라우드의 3D 접촉면(Contact points) 기하 구조를 분석하여 6-DoF 파지 포즈를 제안하는 신경망입니다.\n- **특징**:\n  - CAD 모델이나 물체 분류 없이도 임의의 복잡한 비정형 객체 표면에서 바로 작동.\n  - 가려짐(Occlusion)이 심한 온실 환경에서 유효한 접촉면 탐색에 매우 강력함.\n\n---\n\n## 06. MoveIt 2\n- **저장소**: [https://github.com/moveit/moveit2](https://github.com/moveit/moveit2)\n- **개요**: ROS 2 생태계의 표준 로봇 조작(Manipulation) 프레임워크입니다.\n- **주요 기능**:\n  - 5축/6축 매니퓰레이터(SO-101)의 정기구학/역기구학(IK-Fast, KDL, PickIK) 연산.\n  - OMPL(Open Motion Planning Library) 기반의 RRT-Connect, BiTRRT 충돌 회피 경로 생성.\n  - 3D 점군(OctoMap)을 실시간으로 Planning Scene에 등록하여 줄기 및 지지대와의 충돌을 실시간 회피.\n- **설치**:\n  ```bash\n  sudo apt install ros-humble-moveit\n  ```\n- **우리 프로젝트 연동**:\n  - `ros2/` 스택에서 직교 제어(Cartesian) 시 장애물 회피 궤적 플래닝 엔진으로 결합.\n\n---\n\n## 07. easy_handeye & moveit_calibration\n- **저장소**: [https://github.com/marcoesposito1988/easy_handeye](https://github.com/marcoesposito1988/easy_handeye)\n- **개요**: ROS 및 ROS 2 환경에서 카메라와 로봇 팔 사이의 변환 행렬($^{base}T_{camera}$ 또는 $^{hand}T_{camera}$)을 체커보드/ChArUco 마커를 이용해 대화형 GUI로 자동 측정해주는 툴입니다.\n- **특징**:\n  - Tsai-Lenz, Park-Martin, Daniilidis, Dual Quaternion 등 주요 Hand-Eye 솔버 내장.\n  - Rviz 인터페이스에서 현재 캘리브레이션 오차(잔차)를 시각적으로 확인 가능.\n- **우리 프로젝트 연동**:\n  - 현재 저장소의 `src/tomato_picker/hardware/handeye.py` 알고리즘과 수학적으로 완벽히 호환되며, 젯슨 실장비에서 마커 기반 자동 캘리브레이션 노드로 확장 가능.\n\n---\n\n## 08. ViSP (Visual Servoing Platform)\n- **저장소**: [https://github.com/lagadic/visp](https://github.com/lagadic/visp)\n- **개요**: INRIA에서 개발한 로봇 비주얼 서보잉 전문 라이브러리입니다.\n- **주요 기능**:\n  - 영상 기반 비주얼 서보잉(IBVS) 및 위치 기반 비주얼 서보잉(PBVS).\n  - 로봇 팔의 처짐이나 기구학 오차가 있어도, 타겟 토마토/줄기가 카메라 화면의 정중앙에 올 때까지 엔드이펙터 속도 벡터를 닫힌 루프(Closed-loop)로 지속 보정.\n- **파이썬 바인딩**:\n  ```bash\n  sudo apt install ros-humble-vision-visp\n  # 또는 소스 빌드\n  ```\n\n---\n\n## 09. Hugging Face LeRobot\n- **저장소**: [https://github.com/huggingface/lerobot](https://github.com/huggingface/lerobot)\n- **개요**: 저비용 오픈소스 로봇 팔(SO-100, SO-101, Koch) 및 모바일 매니퓰레이터를 위한 최신 AI 모작 학습(Imitation Learning) 프레임워크입니다.\n- **주요 기능**:\n  - 리더(Leader) 팔 $\\to$ 팔로워(Follower) 팔 간의 실시간 텔레오퍼레이션 및 모션 데이터셋 기록.\n  - ACT(Action Chunking with Transformers), Diffusion Policy 기반 엔드투엔드 파지 정책 학습 지원.\n- **우리 프로젝트 연동**:\n  - 현재 우리 시스템의 `tools/mirror_toggle.py` 및 `firmware/`와 하드웨어 레벨(Feetech STS3215 서보)에서 직접 연결되어 있으며, 사람이 리더 암으로 토마토를 따는 모션을 기록하여 자율 주행 정책으로 학습시킬 수 있습니다.\n\n---\n\n## 10. Tomato-Harvesting-Robot\n- **저장소**: [https://github.com/richard98hess444/Tomato-Harvesting-Robot](https://github.com/richard98hess444/Tomato-Harvesting-Robot)\n- **개요**: RealSense 카메라와 ROS 노드를 활용하여 토마토 검출, 3D 좌표 추정, 그리고 로봇 팔 수확 동작을 수행하는 오픈소스 프로젝트입니다.\n- **특징**:\n  - 초보자가 ROS 비전 노드와 로봇 제어 노드의 통신 구조(`/camera/depth/image_raw` $\\to$ `/tomato_pose` $\\to$ `/arm_controller`)를 이해하기에 가장 직관적인 구조를 가짐.\n\n---\n\n## 11. NVIDIA Isaac Lab / Isaac Sim\n- **저장소**: [https://github.com/isaac-sim/IsaacLab](https://github.com/isaac-sim/IsaacLab)\n- **개요**: NVIDIA Omniverse 기반의 로봇 강화학습 및 물리 시뮬레이션 프레임워크입니다.\n- **주요 기능**:\n  - 초고속 GPU 병렬 시뮬레이션 환경에서 온실 토마토 작물 환경 구축.\n  - 로봇 팔의 충돌 회피 모션 및 소프트 그리퍼의 물리적 상호작용(변형, 마찰)을 사전 검증.\n  - Photorealistic RGB-D 합성 센서 스트림 생성으로 Sim-to-Real 훈련 지원.\n\n---\n\n## 12. PointNeXt (PointNet++ 개선판)\n- **저장소**: [https://github.com/guochengqian/PointNeXt](https://github.com/guochengqian/PointNeXt)\n- **개요**: 기존 PointNet++의 연산 속도와 훈련 안정성을 대폭 개선한 SOTA 3D 포인트 클라우드 세그멘테이션 백본입니다.\n- **적용**:\n  - 잎과 뒤엉킨 토마토 줄기 점군에서 줄기의 3D 기하 중심선(Skeleton)과 꽃받침 연결점을 정확히 분리해내는 데 최적의 3D 딥러닝 모델.\n\n---\n\n다음 문서인 [`04_END_EFFECTOR_MANIPULATION.md`](04_END_EFFECTOR_MANIPULATION.md)에서는 줄기 스켈레톤 추출, 6-DoF Grasp Pose 계산 및 커터 엔드이펙터 설계 원리를 다룹니다.\n\n"}, {"id": "04", "file": "04_END_EFFECTOR_MANIPULATION.md", "title": "엔드이펙터 파지, 줄기 절단 기구학 및 모션 플래닝", "md": "# 엔드이펙터 파지, 줄기 절단 기구학 및 모션 플래닝\n> **End-Effector Design, Peduncle Cutting Kinematics, 6-DoF Pose Synthesis, and Collision-Free Motion Planning**\n\n---\n\n## 1. 수확 방식 비교: 과실 당김(Pulling) vs 줄기 절단(Stem Cutting)\n\n토마토 수확 메커니즘을 설계할 때 가장 먼저 결정해야 하는 것은 **과실을 분리하는 물리적 방식**입니다.\n\n```mermaid\ngraph TD\n    subgraph Method1[\"과실 직접 당김/비틀림 (Pulling / Twisting)\"]\n        A1[\"과실 본체를 강하게 파지\"] --> A2[\"인장력 또는 비틀림 토크 인가\"]\n        A2 --> A3[\"과피 손상(멍, 터짐) 발생률 높음 (15~30%)\"]\n        A3 --> A4[\"탈리층이 엉뚱한 곳에서 뜯겨 상품 가치 하락\"]\n    end\n    subgraph Method2[\"줄기 절단 (Peduncle Cutting) - 권장 표준\"]\n        B1[\"소프트 패드/흡착으로 과실 부드럽게 지지\"] --> B2[\"꽃받침 위 10~15mm 줄기에 커터 진입\"]\n        B2 --> B3[\"전단날로 줄기 순간 절단\"]\n        B3 --> B4[\"과실 무손상 (손상률 < 2%), 꼭지 보존으로 신선도 유지\"]\n    end\n```\n\n| 비교 항목 | 직접 당김 (Pulling) | 줄기 절단 (Cutting) - **산업 표준** |\n|---|---|---|\n| **과실 손상률** | 높음 (15~30%, 과피 압착 및 과즙 분출) | **극히 낮음 (<2%)** |\n| **줄기/꼭지 보존** | 꽃받침이 뜯겨나가거나 열매만 분리됨 | **꽃받침과 T자형 꼭지가 깔끔하게 보존** (상품성 극대화) |\n| **필요 비전 정밀도** | 중간 (과실 3D 중심점만 알면 됨) | **높음 (1~3mm 직경의 줄기 중심선 특정 필요)** |\n| **엔드이펙터 복잡도** | 단순 집게 | **그리퍼 + 커터 복합 기구 (Dual-action)** |\n\n---\n\n## 2. 3D 줄기(Peduncle) 절단점 및 6-DoF 파지 포즈 도출 알고리즘\n\n얇은 줄기(직경 1~3mm)는 3D 포인트 클라우드에서 노이즈로 인해 점이 끊기기 쉽습니다. 따라서 **\"2D 세그멘테이션 마스크에서 스켈레톤(골격)을 추출한 뒤, 깊이 맵과 역투영하여 3D 절단 벡터를 복원하는 2-Stage 하이브리드 파이프라인\"**이 가장 신뢰성이 높습니다.\n\n```mermaid\nflowchart TD\n    I1[\"RGB 영상\"] --> I2[\"YOLOv8-seg (줄기 & 과실 마스크 추출)\"]\n    I2 --> I3[\"Zhang-Suen 세선화 (1픽셀 두께 스켈레톤 그래프 생성)\"]\n    I3 --> I4[\"꽃받침 상단 10~15mm 지점의 절단 픽셀 (u_c, v_c) 특정\"]\n    D1[\"D405 깊이 맵\"] --> I5[\"주변 국소 깊이 평활화 (Median Depth)\"]\n    I4 & I5 --> I6[\"3D De-projection -> 3D 절단 위치 P_cut (X, Y, Z)\"]\n    I3 --> I7[\"스켈레톤 접선 벡터 t_stem 계산\"]\n    I6 & I7 --> I8[\"6-DoF 절단 포즈 (접근 벡터 a, 날 정렬 n, 위치 P_cut) 완성\"]\n```\n\n### 2.1 2D 스켈레톤 추출 및 세선화 (Zhang-Suen Thinning Algorithm)\n줄기 2D 바이너리 마스크 $M(u, v) \\in \\{0, 1\\}$에 대해 Zhang-Suen 반복 세선화를 적용하여 줄기의 중심 뼈대 픽셀 집합 $S = \\{(u_k, v_k)\\}$를 얻습니다.\n\n스켈레톤 상에서 토마토 과실 마스크와 접하는 시작점 $(u_{calyx}, v_{calyx})$으로부터 줄기를 따라 유클리드 거리로 $12\\text{mm}$에 해당하는 화소 거리 $L_{pixel} = 12 \\cdot f_y / Z$ 만큼 떨어진 점을 **절단점 $(u_c, v_c)$**으로 선정합니다.\n\n### 2.2 3D 절단 좌표계 및 회전 행렬 $R_{cutting}$ 도출\n절단점 $(u_c, v_c)$에서 줄기의 진행 방향 접선 단위 벡터를 $\\mathbf{t}_{stem}$이라 할 때, 엔드이펙터가 가져야 할 3차원 자세는 직교 기저(Orthonormal Basis)로 구성됩니다:\n\n1. **줄기 축 벡터 ($\\mathbf{z}_{cut}$)**:\n   $$\n   \\mathbf{z}_{cut} = \\mathbf{t}_{stem}\n   $$\n2. **접근 벡터 ($\\mathbf{x}_{cut}$, 엔드이펙터 진입 방향)**:\n   카메라의 시선 벡터 $\\mathbf{v}_{cam}$과 줄기 축 $\\mathbf{z}_{cut}$에 모두 수직인 방향으로 진입하여 다른 줄기와의 간섭을 최소화합니다:\n   $$\n   \\mathbf{x}_{cut} = \\frac{\\mathbf{v}_{cam} \\times \\mathbf{z}_{cut}}{\\| \\mathbf{v}_{cam} \\times \\mathbf{z}_{cut} \\|}\n   $$\n3. **가위 날 정렬 벡터 ($\\mathbf{y}_{cut}$)**:\n   $$\n   \\mathbf{y}_{cut} = \\mathbf{z}_{cut} \\times \\mathbf{x}_{cut}\n   $$\n\n최종적인 6-DoF 절단 변환 행렬은 다음과 같습니다:\n\n$$\n^{camera}T_{cut} = \\begin{bmatrix}\n\\mathbf{x}_{cut} & \\mathbf{y}_{cut} & \\mathbf{z}_{cut} & \\mathbf{P}_{cut} \\\\\n0 & 0 & 0 & 1\n\\end{bmatrix}\n$$\n\n---\n\n## 3. 5자유도(5-DoF) 매니퓰레이터의 기구학적 특성과 한계 극복 (SO-101 특화)\n\n일반적인 6자유도 산업용 로봇 팔과 달리, 우리 시스템의 SO-101(또는 LeRobot 계열 저비용 팔)은 **5축(5-DoF)** 구조를 가집니다:\n- 관절 1: Base Yaw (회전)\n- 관절 2: Shoulder Pitch (들어올림)\n- 관절 3: Elbow Pitch (팔꿈치)\n- 관절 4: Wrist Pitch (손목 상하)\n- 관절 5: Wrist Roll (손목 회전)\n\n```\n        [관절 4: Wrist Pitch] ─── [관절 5: Wrist Roll] ─── [집게/커터]\n                 │\n        [관절 3: Elbow Pitch]\n                 │\n        [관절 2: Shoulder Pitch]\n                 │\n        [관절 1: Base Yaw]\n                 │\n           [Base Frame]\n```\n\n### 5-DoF의 핵심 기구학적 제약사항\n1. **임의의 자세에서 제자리 Yaw 회전 불가**:\n   손목에 독립적인 Yaw 축이 없으므로, 집게의 수평 방향 각도는 Base Yaw 관절에 완전히 종속됩니다.\n   - **유일한 예외**: 집게가 바닥을 수직으로 내려다보는 자세($\\text{Pitch} \\approx -90^\\circ$)일 때만, `Wrist Roll` 관절이 물리적으로 `Yaw` 회전 역할을 대신할 수 있습니다.\n2. **특이점(Singularity) 회피**:\n   팔을 수직으로 곧게 세웠을 때(`Lift=90, Elbow=0, Wrist=0`)는 기구학적 특이점이 발생하여 순간적으로 X, Y 방향 조그 이동이 차단됩니다.\n   - **대책**: 작업을 시작할 때 반드시 작업 영역 전방으로 살짝 굽혀진 프리셋 자세(Approach Ready Pose)로 먼저 전개한 뒤 직교 좌표 이동(Cartesian Move)을 시작해야 합니다.\n3. **하중 처짐(Sagging) 보상**:\n   금속 고정밀 감속기가 아닌 플라스틱 3D 프린팅 링크와 마이크로 버스 서보를 사용하므로, 팔을 앞으로 길게 뻗을수록 중력에 의해 Z축으로 5~15mm 처짐이 발생합니다.\n   - **대책**: 거리 $R = \\sqrt{X^2 + Y^2}$에 비례하여 Z 목표 좌표를 오프셋 보상($Z_{target} = Z + k \\cdot R^2$)하거나 실시간 비주얼 서보잉으로 닫힌 루프 제어합니다.\n\n---\n\n## 4. 엔드이펙터 하드웨어 복합 메커니즘 설계\n\n로봇 팔의 페이로드(SO-101의 경우 최대 약 250~350g)를 초과하지 않으면서 안정적인 절단 수확을 달성하기 위한 추천 엔드이펙터 설계안입니다:\n\n```\n          [소형 진공 흡착 패드] (과실 중앙 흡착 고정)\n                  ▲\n                  │  (약 30mm 간격)\n                  ▼\n          [마이크로 전동 전단 가위] (줄기 순간 절단)\n             ├── 고정 날 (Anvil)\n             └── 회전/왕복 가동 날 (Blade, 서보/DC 모터 구동)\n```\n\n1. **파지/지지부**:\n   - 미니 12V 진공 펌프와 실리콘 벨로우즈 흡착 컵(직경 20mm).\n   - 과실 표면에 닿는 순간 진공 밸브를 열어 과실을 안정적으로 끌어당겨 고정.\n2. **절단부**:\n   - 흡착 컵 상단 30mm 위치에 소형 스테인리스 전단 날(Shear Blade) 배치.\n   - 소형 서보 모터(또는 솔레노이드)로 0.3초 내에 가위를 닫아 줄기를 절단.\n3. **절단 완료 센싱 (Feedback)**:\n   - 가위 모터의 전류 센싱: 줄기를 자를 때 순간적으로 전류 피크(Spike)가 발생했다가 절단 완료 후 급감하는 프로파일을 감지하여 성공 여부 판별.\n\n---\n\n## 5. 무충돌 수확 모션 시퀀스 (Collision-Free Motion Sequence)\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Planner as MoveIt 2 / Controller\n    participant Arm as SO-101 팔\n    participant Vision as D405 비전\n    participant EE as 복합 엔드이펙터\n\n    Planner->>Arm: 1. Approach Ready Pose로 전개 (프리셋)\n    Vision->>Planner: 2. 토마토 3D 좌표 및 줄기 절단 포즈 T_cut 전송\n    Planner->>Arm: 3. Pre-grasp Pose로 이동 (절단점 전방 50mm)\n    Note over Arm: 충돌 회피 궤적 추종\n    Planner->>Vision: 4. 근접 비주얼 서보잉 확인 (오차 < 3mm)\n    Planner->>Arm: 5. 선형 직교 진입 (Cartesian Push 50mm)\n    Planner->>EE: 6. 진공 흡착 ON (과실 고정)\n    Planner->>EE: 7. 전단 가위 구동 (줄기 절단)\n    EE-->>Planner: 8. 절단 완료 신호 (전류 피크 감지)\n    Planner->>Arm: 9. 과실 후퇴 (Retract 60mm)\n    Planner->>Arm: 10. 바구니 상단(Basket Pose)으로 회전 이동\n    Planner->>EE: 11. 진공 흡착 OFF (과실 바구니 적재)\n    Planner->>Arm: 12. 홈(Home) 자세 복귀\n```\n\n다음 문서인 [`05_PRACTICE_JETSON_ROS2.md`](05_PRACTICE_JETSON_ROS2.md)에서는 본 아키텍처를 현재 실제 로봇 하드웨어에 직접 빌드하고 실행하는 **실전 ROS 2 엔지니어링 코드**를 제공합니다.\n\n"}, {"id": "05", "file": "05_PRACTICE_JETSON_ROS2.md", "title": "실장비 실전 구현 가이드: RealSense D405 + SO-101 + Jetson Orin Nano + ROS 2", "md": "# 실장비 실전 구현 가이드: RealSense D405 + SO-101 + Jetson Orin Nano + ROS 2\n> **Production Engineering Guide: End-to-End Implementation on Real Robot Hardware**\n\n본 문서는 본 저장소(`tomato-picker`)의 실제 하드웨어 구성에 맞춰, 실시간 깊이 비전 스트리밍부터 줄기 절단 및 바구니 적재까지 구동할 수 있는 **완전한 엔지니어링 구현 가이드**입니다.\n\n---\n\n## 1. 하드웨어 배선 및 프로세스 소유권 규칙\n\n우리 로봇 시스템은 자원 경합을 방지하기 위해 엄격한 **단일 프로세스 소유권(Single Process Ownership)** 원칙을 따릅니다:\n\n```\n[Jetson Orin Nano]\n  ├── USB 3.2 ── Intel RealSense D405 (서비스: depth-cam, /dev/shm/d405_*)\n  ├── USB 2.0 ── Orbbec Astra Pro     (서비스: astra-cam, /dev/shm/astra_*)\n  ├── /dev/ttyACM0 ── SO-101 로봇 팔 (단일 프로세스만 독점 점유)\n  └── /dev/ttyUSB0 ── 아두이노 메카넘 주행 보드 (mecanum_stable v2 프로토콜)\n```\n\n> [!CAUTION]\n> 1. **시리얼 포트 중복 점유 금지**: `/dev/ttyACM0`과 `/dev/ttyUSB0`은 동시에 2개 이상의 프로세스가 열 수 없습니다. ROS 2를 구동하기 전 레거시 백그라운드 서비스(`tomato-voice`, `controller-drive`)가 꺼져 있는지 확인하십시오.\n> 2. **카메라 유효 거리 확인**: D405는 대상 토마토가 7~50cm 이내에 있어야 유효한 깊이가 출력됩니다. 50cm를 넘으면 Astra Pro로 전환해야 합니다.\n\n---\n\n## 2. 전체 엔드투엔드 파이썬 실전 노드: `autonomous_harvester.py`\n\n아래 코드는 D405 깊이 뷰어, Hand-Eye 보정 변환, 역기구학 풀이, 팔 시퀀스 구동을 하나로 통합한 완전한 자동 수확 스크립트입니다:\n\n```python\n#!/usr/bin/env python3\n\"\"\"\nautonomous_harvester.py - 토마토 자동 인식, 공간 좌표 변환 및 복합 엔드이펙터 수확 시퀀스\n\"\"\"\nimport os\nimport json\nimport time\nimport math\nimport numpy as np\nimport cv2\nfrom ultralytics import YOLO\n\n# 레포지토리 하드웨어 기구학, 손-눈 보정 및 절단 모듈 직접 import\nfrom tomato_picker.hardware import kinematics as kin\nfrom tomato_picker.hardware.handeye import Rigid, Intrinsics, tool_frame\nfrom tomato_perception.stem_cut import (\n    find_cut_point,\n    sample_stem_depth,\n    compute_cutting_pose,\n    transform_cut_pose,\n    plan_dual_action_trajectory,\n    CutPose3D,\n)\n\nclass AutonomousTomatoHarvester:\n    def __init__(self, calib_path=\"~/arm_eye.json\"):\n        # 1. 캘리브레이션 데이터 로드 (Hand-Eye & Intrinsics: 단위 mm)\n        full_path = os.path.expanduser(calib_path)\n        with open(full_path, \"r\", encoding=\"utf-8\") as f:\n            calib_data = json.load(f)\n\n        # D405 내부 파라미터 로드 (Intrinsics 규약: fx, fy, ppx, ppy)\n        intr_dict = calib_data.get(\"intrinsics\", {})\n        self.intr = Intrinsics(\n            width=int(intr_dict.get(\"width\", 848)),\n            height=int(intr_dict.get(\"height\", 480)),\n            fx=float(intr_dict.get(\"fx\", 438.0)),\n            fy=float(intr_dict.get(\"fy\", 438.0)),\n            ppx=float(intr_dict.get(\"ppx\", 424.0)),\n            ppy=float(intr_dict.get(\"ppy\", 240.0)),\n            model=str(intr_dict.get(\"model\", \"none\")),\n        )\n        \n        # Hand-Eye 변환 로드: 손목 장착(on_arm) 카메라이므로 T_tool_cam (Tool -> Camera, 단위 mm)\n        t_data = calib_data.get(\"transform\", {})\n        self.T_tool_cam = Rigid.from_dict(t_data) if t_data else Rigid(np.eye(3), np.zeros(3))\n        \n        # 2. 딥러닝 세그멘테이션 모델 로드\n        print(\"[AI] YOLOv8 세그멘테이션 모델 로딩 중...\")\n        self.model = YOLO(\"yolov8n-seg.pt\")\n        print(\"[AI] 준비 완료.\")\n\n    def deproject_to_camera_frame(self, u: float, v: float, depth_mm: float) -> tuple[float, float, float]:\n        \"\"\"픽셀 및 깊이(mm) -> 카메라 3차원 광학 좌표 (X_c, Y_c, Z_c) mm.\"\"\"\n        return self.intr.deproject(u, v, depth_mm)\n\n    def transform_to_arm_base(self, P_cam_mm: tuple[float, float, float], current_joints: dict[str, float]) -> tuple[float, float, float]:\n        \"\"\"카메라 광학 좌표(mm) -> 팔 베이스 3D 좌표(mm) 동적 변환 (Eye-in-Hand).\n\n        T_base_cam(t) = T_base_tool(q(t)) * T_tool_cam\n        P_base = T_base_tool(q) * (T_tool_cam * P_cam) = T_base_cam * P_cam\n        \"\"\"\n        # 1. 현재 관절각에서의 순기구학 FK 및 T_base_tool (Rigid 변환) 도출\n        fk = kin.forward(current_joints)\n        T_base_tool = tool_frame(fk)\n\n        # 2. 동적 Eye-in-Hand 합성 변환: T_base_cam = T_base_tool ∘ T_tool_cam\n        T_base_cam = T_base_tool.compose(self.T_tool_cam)\n\n        # 3. 카메라 광학 좌표(mm)를 팔 베이스 arm_base 좌표(mm)로 변환\n        P_base = T_base_cam.apply(P_cam_mm)\n        return (float(P_base[0]), float(P_base[1]), float(P_base[2]))\n\n    def transform_cut_pose_to_arm_base(self, cut_pose_cam: CutPose3D, current_joints: dict[str, float]) -> CutPose3D | None:\n        \"\"\"카메라 광학 좌표계 6-DoF CutPose3D -> 팔 베이스 arm_base 좌표계 CutPose3D 동적 강체 변환 (T_base_cam).\"\"\"\n        fk = kin.forward(current_joints)\n        T_base_tool = tool_frame(fk)\n        T_base_cam = T_base_tool.compose(self.T_tool_cam)\n        return transform_cut_pose(cut_pose_cam, T_base_cam)\n\n    def detect_target(self, color_bgr: np.ndarray, depth_img_raw: np.ndarray, current_joints: dict[str, float]):\n        \"\"\"\n        토마토 과실 및 줄기 검출, 3D 로컬라이제이션 및 6-DoF 절단 포즈 도출\n        depth_img_raw: uint16 밀리미터 또는 float32 미터 (D405 규약: 70mm ~ 500mm 유효)\n        \"\"\"\n        # 깊이 맵 단위 mm 정규화\n        depth_mm = depth_img_raw.astype(np.float64)\n        if depth_img_raw.dtype in (np.float32, np.float64) and float(np.nanmax(depth_mm)) < 20.0:\n            depth_mm = depth_mm * 1000.0\n\n        results = self.model.predict(source=color_bgr, conf=0.6, verbose=False)\n        targets = []\n\n        for r in results:\n            if r.masks is None:\n                continue\n            for mask, box in zip(r.masks.xy, r.boxes):\n                pts = np.int32([mask])\n                M = cv2.moments(pts)\n                if M[\"m00\"] == 0:\n                    continue\n                u = float(M[\"m10\"] / M[\"m00\"])\n                v = float(M[\"m01\"] / M[\"m00\"])\n\n                # 국소 5x5 중앙값 깊이 추출 (D405 유효대역: 70mm ~ 500mm)\n                d_mm = sample_stem_depth(depth_mm, u, v, window_radius=2, min_depth_mm=70.0, max_depth_mm=500.0)\n                if d_mm is None:\n                    continue\n\n                # 3D 카메라 좌표 및 팔 베이스 좌표 산출 (단위: mm)\n                P_cam = self.deproject_to_camera_frame(u, v, d_mm)\n                P_base = self.transform_to_arm_base(P_cam, current_joints)\n\n                # 줄기 세그멘테이션 마스크로부터 6-DoF 절단 포즈 도출\n                cut_pose_base = None\n                px_per_mm = self.intr.fx / d_mm\n                fruit_mask = np.zeros(depth_mm.shape, dtype=bool)\n                cv2.drawContours(fruit_mask.view(np.uint8), [pts], -1, 1, thickness=-1)\n                cut_pt = find_cut_point(fruit_mask, fruit_mask, px_per_mm=px_per_mm, cut_offset_mm=12.0)\n                if cut_pt is not None:\n                    cut_pose_cam = compute_cutting_pose(cut_pt, d_mm, self.intr)\n                    if cut_pose_cam is not None:\n                        cut_pose_base = self.transform_cut_pose_to_arm_base(cut_pose_cam, current_joints)\n\n                # 줄기 미검출 시 상향(+Z) 줄기 기준 공칭 3D 절단 포즈 폴백 합성\n                if cut_pose_base is None:\n                    p_cut_nom = (P_base[0], P_base[1], P_base[2] + 30.0)\n                    cut_pose_base = CutPose3D(\n                        position_mm=p_cut_nom,\n                        rotation_matrix=np.eye(3),\n                        x_cut=(1.0, 0.0, 0.0),\n                        y_cut=(0.0, 1.0, 0.0),\n                        z_cut=(0.0, 0.0, 1.0),\n                        depth_mm=d_mm,\n                    )\n\n                targets.append({\n                    'pixel': (u, v),\n                    'depth_mm': d_mm,\n                    'pos_cam_mm': P_cam,\n                    'pos_base_mm': P_base,\n                    'cut_pose_base': cut_pose_base,\n                })\n\n        return targets\n\n    def execute_harvest(self, fruit_pos_base_mm: tuple[float, float, float], cut_pose_base, arm_controller):\n        \"\"\"\n        복합 엔드이펙터(파지/흡착 + 전단 커터) 4단계 시퀀셜 수확 모션 실행 (단위: mm)\n        \"\"\"\n        print(f\"\\n[Motion] 수확 목표점 (Base 좌표계): X={fruit_pos_base_mm[0]:.1f}mm, Y={fruit_pos_base_mm[1]:.1f}mm, Z={fruit_pos_base_mm[2]:.1f}mm\")\n\n        # 1. 복합 엔드이펙터 4단계 궤적 계획 (Pre-grasp -> Grasp -> Cut -> Retract) 및 작업공간/5-DoF 검증\n        traj = plan_dual_action_trajectory(\n            fruit_pos_base=fruit_pos_base_mm,\n            cut_pose_base=cut_pose_base,\n            cutter_offset_up_mm=30.0,\n            pre_standoff_mm=50.0,\n            retract_standoff_mm=60.0,\n            tolerance_mm=10.0,\n            z_min_mm=15.0,\n            z_max_mm=445.0,\n            r_min_mm=90.0,\n            r_max_mm=310.0,\n        )\n        if traj is None or not traj[\"feasible\"]:\n            err_reason = traj[\"workspace\"][\"violations\"] if (traj and not traj[\"workspace\"][\"feasible\"]) else \"기하 불일치\"\n            print(f\"[Error] 복합 궤적 실행 불가: {err_reason}\")\n            return False\n\n        # 2. 1단계 Pre-grasp: 접근 반대방향 50mm 대기 위치 이동 (stages[0])\n        pre_x, pre_y, pre_z = traj[\"stages\"][0][\"tcp\"]\n        print(f\"[Motion] 1단계: Pre-grasp 대기 자세 접근 (X={pre_x:.1f}, Y={pre_y:.1f}, Z={pre_z:.1f})\")\n        arm_controller.move_to_cartesian(pre_x, pre_y, pre_z)\n        time.sleep(1.5)\n\n        # 3. 2단계 Grasp: 과실 파지/흡착 접촉 자세 진입 및 진공 흡착 ON (stages[1])\n        gx, gy, gz = traj[\"stages\"][1][\"tcp\"]\n        print(f\"[Motion] 2단계: 과실 흡착 접촉 진입 (X={gx:.1f}, Y={gy:.1f}, Z={gz:.1f})\")\n        arm_controller.set_vacuum(True)\n        arm_controller.move_to_cartesian(gx, gy, gz)\n        time.sleep(1.0)\n\n        # 4. 3단계 Cut: 과실 흡착 유지 상태에서 전단 가위 구동 (줄기 순간 절단, stages[2])\n        print(\"[Tool] 3단계: 줄기 전단 가위 작동 (0.3초 순간 절단)\")\n        arm_controller.actuate_cutter()\n        time.sleep(0.5)\n\n        # 5. 4단계 Retract: 수확물 분리 후 안전 후퇴 (1차 파지부 수확물 후퇴 좌표, stages[3])\n        rx, ry, rz = traj[\"stages\"][3][\"tcp_grasp\"]\n        print(f\"[Motion] 4단계: 과실 분리 후 안전 후퇴 (X={rx:.1f}, Y={ry:.1f}, Z={rz:.1f})\")\n        arm_controller.move_to_cartesian(rx, ry, rz)\n        time.sleep(1.0)\n\n        # 6. 바구니 적재\n        print(\"[Motion] 5단계: 바구니로 회전 이동 및 과실 배출\")\n        arm_controller.play_preset_slot(slot_name=\"basket_drop\")\n        time.sleep(2.0)\n        arm_controller.set_vacuum(False)\n        time.sleep(0.5)\n\n        # 7. 홈 복귀\n        print(\"[Motion] 6단계: 홈 위치로 복귀\")\n        arm_controller.play_preset_slot(slot_name=\"home\")\n        print(\"[Done] 복합 엔드이펙터 자동 수확 사이클 성공 완료!\")\n        return True\n```\n\n---\n\n## 3. 자체 무결성 검증 명령어 (PC & Jetson 사전 검증)\n\n젯슨 실장비에 코드를 올리기 전, 수학적 정합성을 검증하기 위해 레포지토리에 내장된 테스트 스위트를 실행하십시오:\n\n```bash\n# 1. Hand-Eye 보정 알고리즘 수학 검증 (45개 테스트)\npython tools/handeye_check.py\n\n# 2. 카메라-로봇 팔 좌표계 배선 검증 (102개 테스트)\npython tools/eye_check.py\n\n# 3. 직교 제어 및 기구학 처짐 피드백 검증 (93개 테스트)\npython tools/arm_cartesian_check.py\n\n# 4. ROS 2 스택 및 보드 통신 종합 검증 (577개 테스트)\npython ros2/tools/ros_selfcheck.py\n\n# 5. 복합 엔드이펙터 궤적 및 줄기 절단 검증 (127개 테스트)\npython ros2/tools/stem_cut_check.py\n```\n\n모든 테스트가 통과하면 수학적 변환 오류나 특이점 충돌 없이 실장비에서 안전하게 구동됩니다.\n\n"}, {"id": "06", "file": "06_LEARNING_COURSE.md", "title": "인지 → 행동 학습 과정: 손목 카메라가 줄기를 보고 자르기까지", "md": "# 인지 → 행동 학습 과정: 손목 카메라가 줄기를 보고 자르기까지\n> 책(도서관) → 논문 완독 → 오픈소스 완독 → 이 로봇에서 해보기. 한 모듈 = 한 질문.\n\n00~05가 \"무엇이 있는가\"의 지도라면, 이 문서는 **어떤 순서로 무엇을 읽고 무엇을 손으로 해 봐야\n그 지도가 이해되는가**다. 이미지 처리·OS 수준(드라이버, 프레임 버퍼, 필터)은 일부러 뺐다.\n\n---\n\n## 0. 한 장면을 일곱 질문으로 쪼갠다\n\n\"D405가 줄기를 보고 가위가 자른다\" 사이에는 끊을 수 있는 고리가 일곱 개 있다.\n각 모듈은 고리 하나를 맡고, 고리마다 **이 저장소에 이미 그 답을 구현한 코드**가 있다.\n\n```\n RGB 화소 (u,v) + 깊이 d\n   │ M1 이 화소는 카메라 앞 공간의 어느 점인가?        (카메라 모델·깊이 센서·역투영)\n   ▼\n 카메라 좌표 P_cam (X,Y,Z)\n   │ M2 그 점은 팔 기준으로 어디인가?                    (강체변환·TF·손-눈 보정)\n   ▼\n 팔 좌표 P_base\n   │ M3 화면에서 어느 화소들이 '줄기'인가?              (분할 + RGB와 깊이를 합치기)\n   ▼\n 줄기 점군\n   │ M4 줄기의 어디를, 어느 방향에서 자르나?            (점군 기하·절단점·접근 자세)\n   ▼\n 목표 자세 T_target (위치 + 방향)\n   │ M5 손끝을 거기로 어떻게 보내나? 5축이면 다 되나?   (기구학·역기구학·궤적)\n   ▼\n 관절각 q\n   │ M6 보정이 틀렸을 때 어떻게 그래도 닿나?           (비주얼 서보잉·더듬기·폐루프)\n   ▼\n 절단\n     M7 (선택) 위 전부를 시연에서 한 번에 배울 수 있나?  (모방학습: ACT·Diffusion Policy)\n```\n\n**핵심 직관 하나만 먼저**: RGB는 \"무엇인가\"를, 깊이는 \"어디인가\"를 안다. 둘을 합치는 방법은\n거의 언제나 같다 — **RGB에서 화소를 고르고(M3), 그 화소들의 깊이로 3D 점을 만든 뒤(M1),\n그 점들의 모양으로 자를 곳을 정한다(M4).** 나머지는 그 점을 팔 언어로 옮기는 일(M2·M5)과\n틀렸을 때 고치는 일(M6)이다.\n\n---\n\n## 1. 교재 — 경희대 도서관에서 빌릴 것\n\n⚠ **경희대 수업계획서는 외부에 공개돼 있지 않고, 도서관 검색도 로그인 뒤에 있다**(2026-10-22 확인).\n아래는 국내외 로봇공학·컴퓨터비전 과목에서 표준으로 쓰는 교재다. 소장 여부는 직접 확인하라:\n- 소장 검색: <https://lib.khu.ac.kr> → 없으면 **희망도서 신청 / 상호대차**. Springer·Cambridge 책은\n  전자책(SpringerLink)으로 학내망에서 열리는 경우가 많다.\n- 교과목 추천도서: 학교 포털의 **수업계획서 조회**에서 기계공학과·전자공학과·컴퓨터공학과의\n  \"로봇공학\", \"컴퓨터비전\", \"로봇비전\", \"메카트로닉스\" 계열 과목을 검색해 교재 칸을 보라.\n  거기 나온 책이 아래 표와 겹치면 그 과목 강의자료를 같이 쓰면 된다.\n\n| # | 책 | 이 과정에서의 역할 | 읽을 부분 |\n|---|---|---|---|\n| **B1** | Peter Corke, *Robotics, Vision and Control: Fundamental Algorithms in Python*, 3rd ed., Springer 2023 | **척추.** 이 질문(보고 → 움직이기)을 정확히 한 권으로 다루는 유일한 교과서. 코드가 붙어 있다 | 2장(자세 표현), 7·8장(팔 기구학·속도), 13장(영상 형성·카메라 보정), 14장(여러 영상), **15·16장(시각 기반 제어)** |\n| **B2** | Kevin Lynch & Frank Park(박종우), *Modern Robotics*, Cambridge 2017 — **무료 PDF** modernrobotics.org | 강체변환·기구학의 수학. SE(3)·스크류를 제대로 | 3장(강체운동), 4·5·6장(순·속도·역기구학), 9장(궤적), 12장(파지) |\n| **B3** | Richard Szeliski, *Computer Vision: Algorithms and Applications*, 2nd ed., 2022 — **무료 PDF** szeliski.org/Book | 비전 전반의 참고서 | 2장(영상 형성), 4장(모델 피팅·RANSAC), 6장(인식·분할), 11.1절(카메라 보정), 12장(깊이 추정) |\n| **B4** | Hartley & Zisserman, *Multiple View Geometry in Computer Vision*, 2nd ed., Cambridge 2004 | 카메라 기하의 원전. 막힐 때 찾아보는 책 | 6장(카메라 모델), 7장(P 행렬 추정), 4장(DLT·RANSAC) |\n| **B5** | Spong, Hutchinson, Vidyasagar, *Robot Modeling and Control*, 2nd ed., Wiley 2020 | 국내 로봇공학 과목 단골 교재. 기구학과 **시각 기반 제어 장**이 짧고 명료 | 기구학 장들 + Vision-Based Control 장 |\n| **B6** | Siciliano & Khatib (eds), *Springer Handbook of Robotics*, 2nd ed., 2016 | 분야별 요약. 각 장 끝 참고문헌이 논문 지도 | \"Visual Servoing\", \"3-D Vision for Navigation and Grasping\", \"Grasping\", \"Robotics in Agriculture and Forestry\" 장 |\n| **B7** | 오일석, 『컴퓨터 비전』, 한빛아카데미 2014 | 한국어로 개념 잡기(B3 대신 먼저 보기 좋다) | 기하·3차원 비전 부분 |\n| **B8** | 표윤석·임태훈, 『ROS 2로 시작하는 로봇 프로그래밍』, 루비페이퍼 | TF·토픽·노드 — ros2/ 계통을 읽기 위한 최소한 | TF2, 메시지·토픽 장 |\n\n**고르는 법**: 시간이 없으면 **B1 하나 + B2의 3~6장**이면 M1~M6이 다 덮인다. 나머지는 막힐 때 찾는 사전이다.\n\n---\n\n## 2. 로봇팔을 움직이는 교재\n\n팔을 움직이는 건 네 층이다: **기구학**(자세 계산) → **궤적·계획**(경로) → **제어**(따라가기) → **파지**(물체 다루기).\n\n### 먼저 볼 것 — 하나만 고르면\n\n| 책 | 왜 |\n|---|---|\n| **Lynch & Park, *Modern Robotics*** (Cambridge 2017) | 무료 PDF + **강의 영상**(Coursera, modernrobotics.org). 짧은 영상 단위로 쪼개져 있어 혼자 공부하기 가장 좋다. 팔 움직임 전체를 덮는다: 3장 강체운동, 4장 순기구학, 5장 속도·야코비안, 6장 역기구학, 8장 동역학, 9장 궤적, 10장 운동계획, 11장 제어, 12장 파지. 책과 1:1 대응하는 코드 라이브러리도 있다. |\n\n### 같은 내용을 다른 각도로 (국내 수업 교재로 흔한 것)\n\n| 책 | 특징 |\n|---|---|\n| **John Craig, *Introduction to Robotics: Mechanics and Control*** (4판, Pearson) | 국내 \"로봇공학\" 수업에서 가장 흔한 교재. D-H 표기 기반, 예제 위주라 손계산 연습에 좋다. |\n| **Spong, Hutchinson, Vidyasagar, *Robot Modeling and Control*** (2판, Wiley 2020) | 기구학~제어가 짧고 명료. **시각 기반 제어 장**이 있어 M6과 이어진다. |\n| **Siciliano, Sciavicco, Villani, Oriolo, *Robotics: Modelling, Planning and Control*** (Springer 2009) | 위 두 권보다 깊다. 궤적 계획·힘 제어 장이 특히 좋다. |\n\n### 경로 계획 — 장애물(줄기·와이어) 피해 가기\n\n| 책 | 특징 |\n|---|---|\n| **Steven LaValle, *Planning Algorithms*** (Cambridge 2006, **무료** lavalle.pl) | MoveIt 2가 쓰는 OMPL(RRT·PRM)의 원전. 5장(표본 기반 계획)이 핵심. |\n| **Choset 외, *Principles of Robot Motion*** (MIT Press 2005) | 같은 주제를 더 교과서적으로. |\n\n### 더 깊이 — 필요해지면\n\n| 책 | 특징 |\n|---|---|\n| **Murray, Li, Sastry, *A Mathematical Introduction to Robotic Manipulation*** (CRC 1994, **무료 PDF**) | Modern Robotics의 수학적 원조. 파지 장이 엄밀. |\n| **Matthew Mason, *Mechanics of Robotic Manipulation*** (MIT Press 2001) | 밀기·쥐기·마찰 — \"왜 미끄러지나\"를 이해할 때. |\n| **Corke, *Robotics, Vision and Control*** (3판) | 위 B1. 7~9장이 팔, 전부 파이썬으로 바로 돌려볼 수 있다. |\n\n### 이 로봇 기준 추천 순서\n\n1. **Modern Robotics 3~6장 + 강의 영상** → [`kinematics.py`](../../src/tomato_picker/hardware/kinematics.py)를 나란히 읽는다. SO-101이 5축이라 왜 제자리 yaw가 안 되는지가 5·6장(야코비안·특이점)에서 설명된다.\n2. **9장(궤적)** → 프리셋 재생·보간([`presets.py`](../../src/tomato_picker/hardware/presets.py))과 비교.\n3. **11장(제어)** + Spong 제어 장 → STS3215 서보가 내부에서 하는 위치 제어와, 우리가 바깥에서 하는 \"목표각을 어떻게 줄까\"의 경계.\n4. 줄기·와이어 사이로 들어가야 할 때 → LaValle 5장 + MoveIt 2.\n\n무료로 바로 시작 가능: Modern Robotics, LaValle, Murray-Li-Sastry. Craig·Spong은 도서관 소장 확인.\n\n---\n\n## 3. 논문 읽는 법 — \"완독\"의 정의\n\nS. Keshav, \"How to Read a Paper\", *ACM SIGCOMM CCR* 2007 (2쪽, 무료)의 3회 읽기를 쓴다.\n1. **1회(10분)**: 제목·초록·그림·결론. \"이 논문이 푸는 문제를 한 문장으로\" 쓸 수 있으면 통과.\n2. **2회(1시간)**: 식은 건너뛰고 방법·실험을 따라간다. 표/그래프의 축을 다 읽는다.\n3. **3회(반나절~)**: **저자가 한 것을 내가 다시 만든다고 가정하고** 읽는다 — 식을 직접 유도하거나\n   코드가 있으면 돌린다. 숨은 가정(카메라 위치, 조명, 실패 사례를 어떻게 셌는지)을 적는다.\n\n완독 노트는 논문마다 5줄로 남긴다: **문제 / 입력→출력 / 핵심 아이디어 / 숨은 가정 / 우리 로봇에선?**\n마지막 줄이 이 과정의 목적이다.\n\n⚠ **출처를 확인하고 읽어라.** 아래 목록은 저자·학회·연도를 확인한 것만 넣었다.\n`02_PAPERS_CATALOG.md`는 2026-10-24에 한 편씩 검증해 고쳤다(없는 논문 13편 교체, 9편 서지·수치 정정).\n그래도 *(2차 인용)* 표시 수치는 원문에서 다시 확인하고, **DOI를 열어** 읽어라.\nIEEE Xplore·ScienceDirect·Wiley 원문은 경희대 도서관 전자자원(학내망/원격접속)으로 연다.\n\n---\n\n## 4. 모듈별 과정\n\n각 모듈 = **질문 → 왜 어려운가(이 로봇에서 실제로 겪은 것) → 책 → 논문 → 코드 완독 → 해보기 → 졸업 질문.**\n졸업 질문에 **종이 한 장으로** 답할 수 있으면 다음 모듈로 간다.\n\n### M1. 화소 하나는 공간의 어느 점인가 — 카메라 모델과 깊이 센서 (2주)\n\n- **핵심 식**: 핀홀 역투영 `X=(u−cx)·Z/fx, Y=(v−cy)·Z/fy, Z=d` (`01_SPATIAL_PERCEPTION.md` §1).\n  식은 쉽다. 어려운 건 **d가 얼마나 믿을 만한가**다.\n- **왜 어려운가**: D405는 투광기 없는 스테레오라 **무늬 없는 면·가는 물체·경계에서 깊이가 흔들리거나\n  빈다**. 줄기 2~5mm는 그 흔들림보다 가늘다(`docs/개발일지-2026-09-11.md` \"거리를 맞힐 수 있다\"는\n  틀린 전제). Astra는 구조광이라 60cm 안쪽을 못 보고, 컬러와 깊이가 정렬돼 있지 않다.\n- **책**: B1 13장 · B3 2장, 12장 앞부분 · B4 6장\n- **논문(완독)**\n  1. Z. Zhang, \"A Flexible New Technique for Camera Calibration\", *IEEE TPAMI* 2000 — 바둑판으로 K를 푸는 법. 지금도 OpenCV가 이걸 쓴다.\n  2. L. Keselman et al., \"Intel RealSense Stereoscopic Depth Cameras\", *CVPR Workshops* 2017 (arXiv 1705.05548) — 스테레오 깊이 오차가 **거리²에 비례**하는 이유.\n- **코드 완독**\n  - librealsense `include/librealsense2/rsutil.h` — `rs2_deproject_pixel_to_point` / `rs2_project_point_to_pixel`. 왜곡 모델 포함 200줄 남짓.\n  - 이 저장소 [`hardware/depth_camera.py`](../../src/tomato_picker/hardware/depth_camera.py) — 단위·유효거리·정렬을 **meta.json에서 읽는** 이유(D405 0.1mm vs Astra 1mm).\n- **해보기**\n  - D405 앞에 자를 세우고 7·15·30·50cm에서 같은 점의 깊이를 100프레임 모아 **표준편차 vs 거리** 그래프를 그린다. Keselman의 거리² 법칙이 맞는지 본다.\n  - 같은 실험을 면봉(가는 표적)으로. 경계 화소의 \"날아다니는 점(flying pixel)\"을 직접 찾는다.\n- **졸업 질문**: 줄기 하나의 깊이를 **한 화소로 읽으면 왜 안 되는가**, 그럼 어떻게 읽나?\n\n### M2. 그 점은 팔 기준으로 어디인가 — 강체변환·TF·손-눈 보정 (2주)\n\n- **핵심 식**: `P_base = T_base_tool(q) · T_tool_cam · P_cam`. 앞은 기구학(M5)이 주고,\n  가운데 `T_tool_cam`은 **아무도 모르니 실측에서 푼다** — 그게 손-눈 보정 `AX = XB`다.\n- **왜 어려운가**: 이 로봇은 손-눈 보정 잔차가 44mm에서 안 내려갔다(`ros2/tools/visual_servo.py` 머리말,\n  메모 \"평행이동 실측의 3~5배\"). 최소자승은 입력이 쓰레기여도 답을 낸다 — **잔차를 읽는 법**이 이 모듈의 핵심.\n- **책**: B2 3장(SE(3), 지수좌표) · B1 2장 · B8 TF2 장\n- **논문(완독)**\n  1. R. Tsai & R. Lenz, \"A New Technique for Fully Autonomous and Efficient 3D Robotics Hand/Eye Calibration\", *IEEE Trans. Robotics and Automation* 1989 — 원조.\n  2. F. Park & B. Martin, \"Robot Sensor Calibration: Solving AX=XB on the Euclidean Group\", *IEEE TRA* 1994 — B2 저자의 해법. 회전을 리 군에서 푼다.\n  3. T. Foote, \"tf: The Transform Library\", *IEEE TePRA* 2013 — 좌표계가 **시간**을 가진다는 것(왜 HTTP 폴링으로는 TF가 안 맞는지).\n- **코드 완독**\n  - OpenCV `modules/calib3d/src/calibration_handeye.cpp` — `calibrateHandEye`가 Tsai·Park·Horaud·Andreff·Daniilidis 다섯 방법을 한 파일에 구현.\n  - 이 저장소 [`hardware/handeye.py`](../../src/tomato_picker/hardware/handeye.py)(424줄, numpy만) — `fixed`/`on_arm` 두 식. 위 논문을 읽은 뒤 읽으면 줄마다 대응이 보인다.\n- **해보기**\n  - `python tools/handeye_check.py` 를 돌리고, 테스트 하나를 골라 **입력에 1°/5mm 잡음을 넣으면 잔차가 얼마나 커지는지** 직접 바꿔 본다.\n  - 같은 데이터를 OpenCV `calibrateHandEye`의 5개 방법으로 풀어 `handeye.py`와 비교한다(PC에서, 젯슨 불필요).\n- **졸업 질문**: 잔차 44mm가 나왔다. **회전이 틀린 것과 평행이동이 틀린 것을 데이터로 어떻게 구별하나?**\n\n### M3. 화면에서 어느 화소가 줄기인가 — 분할, 그리고 RGB+깊이 합치기 (2주)\n\n- **핵심**: 2D 인스턴스 분할로 마스크를 얻고 → 마스크 안 화소만 역투영(M1) → 깊이로 **뒤 배경을 잘라낸다**.\n  \"RGB와 깊이를 같이 쓴다\"의 실체는 대부분 이것이다.\n- **왜 어려운가**: 가는 표적은 마스크 경계가 곧 깊이 경계라 배경 깊이가 섞인다. 또\n  **가장 가까운 것은 자기 손가락이다**(개발일지 9/11 틀린 전제 ②).\n- **책**: B3 6장(인식·분할) · B7 해당 장\n- **논문(완독)**\n  1. K. He et al., \"Mask R-CNN\", *ICCV* 2017 (arXiv 1703.06870) — 인스턴스 분할의 기본형. YOLO-seg도 이 문제 정의를 따른다.\n  2. **I. Sa et al., \"Peduncle Detection of Sweet Pepper for Autonomous Crop Harvesting — Combined Color and 3-D Information\", *IEEE RA-L* 2017 (arXiv 1701.08608)** — 이 과정의 **중심 논문**. 제목 그대로 \"색 + 3D로 꼭지를 찾는다\". 특징 설계·평가 방식을 통째로 따라 할 만하다.\n  3. A. Kirillov et al., \"Segment Anything\", *ICCV* 2023 (arXiv 2304.02643) — 라벨 없이 클릭 한 번으로 마스크. `click_server`의 \"사람이 줄기를 찍는다\"와 바로 붙는다.\n- **코드 완독**\n  - 이 저장소 [`tomato_perception/yolo_seg.py`](../../ros2/src/tomato_perception/tomato_perception/yolo_seg.py) + [`detect_node.py`](../../ros2/src/tomato_perception/tomato_perception/detect_node.py) — 마스크 → 깊이 거절 → 3D까지.\n  - Laboro Tomato 데이터셋(github.com/laboroai/LaboroTomato)의 주석 형식 — 무엇을 \"한 개체\"로 라벨링했는지.\n- **해보기**\n  - 같은 줄기 사진에서 **마스크 전체 깊이의 중앙값 / 최솟값 / 평균**을 비교한다. 어느 것이 손가락·배경에 오염되는지.\n  - `python ros2/tools/yolo_seg_check.py` 를 읽고 돌린다.\n- **졸업 질문**: 분할 마스크가 완벽해도 **3D 점이 틀릴 수 있는 이유 두 가지**는?\n\n### M4. 줄기의 어디를 어느 방향에서 자르나 — 점군 기하 (2주)\n\n- **핵심**: 줄기 점군 → 잡음 제거 → **직선(축) 피팅(PCA 또는 RANSAC)** → 과실 쪽에서 일정 거리 위를\n  절단점으로 → 가위 날이 축에 **수직**이 되도록 접근 방향을 정한다. 그게 \"6-DoF 절단 자세\"다.\n- **왜 어려운가**: 줄기 축이 카메라 쪽을 향하면 점이 한 덩어리로 뭉쳐 축이 안 나온다.\n  5축 팔은 모든 방향에서 접근할 수 없다(M5) — **\"자를 수 있는 자세\"와 \"팔이 갈 수 있는 자세\"의 교집합**을 찾는 문제다.\n- **책**: B3 4장(RANSAC·강건 피팅) · B2 12장(파지·접촉) · B6 \"Grasping\" 장\n- **논문(완독)**\n  1. M. Fischler & R. Bolles, \"Random Sample Consensus\", *Comm. ACM* 1981 — RANSAC 원전. 8쪽.\n  2. **T. Yoshida, T. Fukao, T. Hasegawa, \"Fast Detection of Tomato Peduncle Using Point Cloud with a Harvesting Robot\", *J. Robotics and Mechatronics* 30(2), 2018** 및 **\"Cutting Point Detection Using a Robot with Point Clouds for Tomato Harvesting\", *JRM* 32(2), 2020** — **토마토 꼭지 절단점을 RGB-D 점군에서 찾는** 바로 그 문제. JRM은 공개 접근(fujipress.jp).\n  3. A. ten Pas, M. Gualtieri, K. Saenko, R. Platt, \"Grasp Pose Detection in Point Clouds\", *IJRR* 2017 — 점군에서 파지 자세 후보를 만들고 거르는 일반론. 절단 자세도 같은 틀이다.\n- **코드 완독**\n  - Open3D `PointCloudSegmentation.cpp`(SegmentPlane — RANSAC 구현) · `create_from_rgbd_image`.\n  - 이 저장소 [`tomato_perception/stem_cut.py`](../../ros2/src/tomato_perception/tomato_perception/stem_cut.py) — 절단 자세·깊이 평활화·비직교(shear) 거절. 검사 [`stem_cut_check.py`](../../ros2/tools/stem_cut_check.py)를 먼저 읽으면 **무엇을 막으려 했는지**가 보인다.\n- **해보기**\n  - Open3D로 D405 한 프레임을 점군으로 만들고, 줄기 마스크 점만 남겨 PCA 축을 그려 본다. 카메라를 줄기 축에 대해 0°/45°/80° 돌려 찍으며 **축 추정이 언제 무너지는지** 기록한다.\n- **졸업 질문**: 줄기 축 추정의 **불확실성**을 숫자로 내려면? 그 숫자로 \"이 프레임은 자르지 마라\"를 어떻게 정하나?\n\n### M5. 손끝을 거기로 어떻게 보내나 — 기구학과 5축의 한계 (2주)\n\n- **핵심**: 순기구학 `T(q)`, 역기구학 `q = IK(T)`, 야코비안 `ẋ = J(q)q̇`. 5축이라 6-DoF 목표 중 하나는 **포기**해야 한다.\n- **왜 어려운가**: SO-101은 5축이라 제자리 yaw가 일반적으로 불가능하고(집게가 바닥을 볼 때만 roll=yaw),\n  STS3215는 0.088°/틱보다 작은 지령이 물리적으로 0이다. 중력 처짐이 영점 오차가 된다.\n- **책**: B2 4·5·6·9장(이 모듈의 본체) · B1 7·8장 · B5 기구학 장\n- **논문(완독)**\n  1. D. Coleman et al., \"Reducing the Barrier to Entry of Complex Robotic Software: a MoveIt! Case Study\", *JOSER* 2014 — 계획기·IK·충돌검사를 어떻게 나눴는가.\n  2. S. Macenski et al., \"Robot Operating System 2: Design, Architecture, and Uses in the Wild\", *Science Robotics* 2022 — ros2/ 계통을 왜 그렇게 짰는지의 배경.\n- **코드 완독**\n  - NxRLab `ModernRobotics` 파이썬 라이브러리(`modern_robotics/core.py`) — B2 식이 거의 한 줄씩 함수다. 한 파일, 완독 가능.\n  - 이 저장소 [`hardware/kinematics.py`](../../src/tomato_picker/hardware/kinematics.py)(255줄, `math`만) — 위 라이브러리와 나란히 놓고 읽는다.\n- **해보기**\n  - `python tools/arm_cartesian_check.py` 통과 후, `kinematics.py`의 순기구학을 `ModernRobotics.FKinSpace`로 다시 짜서 **같은 q에서 같은 T**가 나오는지 assert로 확인한다.\n  - 줄기 축 방향 몇 개를 주고 \"5축으로 수직 절단이 가능한가\"를 판정하는 함수를 짜 본다(M4와 이어짐).\n- **졸업 질문**: 6-DoF 절단 자세가 주어졌을 때 5축 팔이 **무엇을 포기하는 게 가장 덜 나쁜가**? 왜?\n\n### M6. 보정이 틀려도 닿게 하려면 — 비주얼 서보잉과 더듬기 (2주)\n\n- **핵심**: 열린 루프(\"계산하고 간다\")는 M1~M5의 오차가 전부 쌓인다. 닫힌 루프(\"보면서 간다\")는\n  **화면에서 목표와 집게 사이 오차를 직접 줄이므로** 보정 오차가 상쇄된다. 이 로봇이 실제로 간 길이다.\n- **왜 어려운가**: 화소 오차가 줄어드는데 실패하는 경우 — 가는 표적에서 정합이 **배경을 따라간다**(메모 \"Thin target tracking fails\").\n  깊이 방향은 화면에서 안 보인다 → \"60%만 가서 물어보고 8mm 더\"(개발일지 9/11).\n- **책**: **B1 15·16장(이 과정의 클라이맥스)** · B5 Vision-Based Control 장 · B6 \"Visual Servoing\" 장\n- **논문(완독)**\n  1. S. Hutchinson, G. Hager, P. Corke, \"A Tutorial on Visual Servo Control\", *IEEE TRA* 1996.\n  2. F. Chaumette & S. Hutchinson, \"Visual Servo Control, Part I: Basic Approaches\", *IEEE RA Magazine* 2006 (+ Part II, 2007) — IBVS vs PBVS, 상호작용 행렬. **짧고 결정적**.\n  3. D. Morrison, P. Corke, J. Leitner, \"Closing the Loop for Robotic Grasping: A Real-time, Generative Grasp Synthesis Approach\", *RSS* 2018 (GG-CNN) — 깊이 영상만으로 매 프레임 파지점을 다시 내는 폐루프 파지.\n- **코드 완독**\n  - github.com/dougsm/ggcnn — 작은 저장소, 완독 가능.\n  - Corke의 `machinevision-toolbox-python` / `robotics-toolbox-python`의 시각 서보 예제(B1 15장과 짝).\n  - 이 저장소 [`ros2/tools/visual_servo.py`](../../ros2/tools/visual_servo.py)(머리말이 곧 설계 문서: **실측 야코비안**) → [`grasp_probe.py`](../../ros2/tools/grasp_probe.py) → [`stem_grasp.py`](../../ros2/tools/stem_grasp.py).\n- **해보기**(⚠ 실기 — `docs/인수인계-2026-09-03.md`를 먼저 읽고, 사람이 보는 앞에서)\n  - `visual_servo.py`의 실측 야코비안을 B1 15장의 **해석적 상호작용 행렬**과 비교한다: 같은 자세에서 둘이 얼마나 다른가?\n  - 면봉으로 `--to 200` 을 반복하며 **화소 오차 vs 실제 집게-표적 거리(자로 잼)**를 같이 기록한다. 둘이 갈라지는 순간이 이 모듈의 교훈이다.\n- **졸업 질문**: IBVS와 PBVS 중 **손-눈 보정 잔차가 큰 이 로봇**에 맞는 것은? 깊이 축은 어떻게 처리하나?\n\n### M7. (선택) 시연에서 한 번에 배우기 — 모방학습 (2주)\n\n- **핵심**: M1~M6을 사람이 설계하는 대신, 리더암 시연(이미 하고 있는 미러링)에서 **영상 → 관절 명령**을 통째로 학습.\n  설계형 파이프라인과 **비교 대상**으로 알아 둘 가치가 있다.\n- **논문(완독)**\n  1. T. Zhao et al., \"Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware\", *RSS* 2023 (ACT, arXiv 2304.13705) — SO-101 같은 저가 팔을 전제로 쓴 논문.\n  2. C. Chi et al., \"Diffusion Policy\", *RSS* 2023 (arXiv 2303.04137).\n- **코드 완독**: 젯슨에 깔린 lerobot의 `policies/act/modeling_act.py`.\n- **졸업 질문**: 줄기 절단을 모방학습으로 하면 M1~M6의 **어떤 문제가 사라지고 어떤 문제가 남나**?\n\n---\n\n## 5. 큰 그림 — 남들은 어떻게 해 왔나 (과정 중간중간 1편씩)\n\n시스템 전체를 만든 팀들의 논문이다. **M3 전후로 하나, M6 끝나고 하나**씩 읽으면 각 모듈이 전체의 어디인지 잡힌다.\n\n| 순서 | 논문 | 볼 것 |\n|---|---|---|\n| 1 | C. W. Bac, E. J. van Henten, J. Hemming, Y. Edan, \"Harvesting Robots for High-Value Crops: State-of-the-Art Review and Challenges Ahead\", *J. Field Robotics* 2014 | 30년간 성공률이 왜 안 올랐나 — 실패 원인의 분류 |\n| 2 | H. Yaguchi, K. Nagahama, T. Hasegawa, M. Inaba, \"Development of an Autonomous Tomato Harvesting Robot with Rotational Plucking Gripper\", *IROS* 2016 | **토마토**, 자르지 않고 비틀어 따기(성공률 ~60%) — 절단과의 맞교환 |\n| 3 | C. Lehnert et al., \"Autonomous Sweet Pepper Harvesting for Protected Cropping Systems\", *IEEE RA-L* 2017 | Sa 2017(M3)을 실제 로봇(Harvey)에 붙인 결과. 흡착 + 절단 |\n| 4 | B. Arad et al., \"Development of a Sweet Pepper Harvesting Robot\", *J. Field Robotics* 2020 (SWEEPER) | 온실 실증, 손목 카메라 · 실패 분석 |\n| 5 | Y. Xiong, Y. Ge, P. From, \"An Autonomous Strawberry-Harvesting Robot: Design, Development, Integration, and Field Evaluation\", *J. Field Robotics* 2020 | 줄기를 **잡고 자르는** 집게, 가림 속 접근 |\n| 6 | G. Kootstra et al., \"Selective Harvesting Robotics: Current Research, Trends, and Future Directions\", *Current Robotics Reports* 2021 (DOI 10.1007/s43154-020-00034-1) | 짧은 최신 개관 |\n| 7 | V. Rajendran et al., \"Towards Autonomous Selective Harvesting: A Review of Robot Perception, Robot Design, Motion Planning and Control\", *J. Field Robotics* 2024 (arXiv 2304.09617) | 이 과정 M1~M6과 같은 축으로 정리된 개관 — 마지막에 읽고 빈칸 점검 |\n\n---\n\n## 6. 일정 예시 (주 6~8시간 기준, 약 14주)\n\n| 주 | 모듈 | 책 | 논문 | 손 |\n|---|---|---|---|---|\n| 1–2 | M1 | B1 13 · B3 2 | Zhang · Keselman | 깊이 잡음 vs 거리 |\n| 3 | (큰 그림) | — | Bac 2014 | — |\n| 4–5 | M2 | B2 3 · B1 2 | Tsai-Lenz · Park-Martin · Foote | handeye 잡음 주입·OpenCV 비교 |\n| 6–7 | M3 | B3 6 | Mask R-CNN · **Sa 2017** · SAM | 마스크 깊이 통계 |\n| 8 | (큰 그림) | — | Lehnert 2017 · Yaguchi 2016 | — |\n| 9–10 | M4 | B3 4 · B2 12 | RANSAC · **Yoshida 2018/2020** · GPD | 줄기 축 PCA·각도별 붕괴 |\n| 11–12 | M5 | B2 4–6, 9 | MoveIt · ROS 2 | FK 교차검증·5축 가능성 판정 |\n| 13–14 | M6 | **B1 15–16** | Hutchinson · Chaumette · GG-CNN | 야코비안 비교·화소 vs 실거리 |\n| (+2) | M7 | — | ACT · Diffusion Policy | lerobot ACT 읽기 |\n| 마지막 | — | — | Arad · Xiong · Kootstra · Rajendran | 졸업 질문 7개를 한 문서로 |\n\n**마지막 산출물**: 졸업 질문 7개의 답을 이 로봇의 숫자(잔차, 깊이 표준편차, 성공률)로 채운 한 문서.\n그게 곧 \"이 로봇이 왜 아직 줄기를 못 자르는가 / 무엇을 바꾸면 되는가\"의 답이다.\n"}];
const $doc = document.getElementById('doc'), $toc = document.getElementById('toc');
const ready = typeof marked !== 'undefined';
if (typeof mermaid !== 'undefined') mermaid.initialize({ startOnLoad:false, theme:'default' });

const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-');

// 수식을 marked보다 먼저 빼 둔다(밑줄·역슬래시가 강조/이스케이프로 먹힌다). 코드 안의 $는 건드리지 않는다.
function render(md) {
  if (!ready) return '<pre>' + md.replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;') + '</pre>';
  const math = [];
  md = md.replace(/(```[\s\S]*?```|`[^`\n]+`)|\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, (m, code, disp, inl) => {
    if (code) return code;
    math.push([disp ?? inl, disp !== undefined]);
    return `@@MATH${math.length - 1}@@`;
  });
  let html = marked.parse(md);
  return html.replace(/@@MATH(\d+)@@/g, (_, i) => {
    const [tex, display] = math[i];
    try { return katex.renderToString(tex, { displayMode:display, throwOnError:false }); }
    catch { return tex; }
  });
}

function show(id) {
  const d = DOCS.find(x => x.id === id) || DOCS[0];
  $doc.innerHTML = render(d.md);
  $doc.querySelectorAll('h1,h2,h3,h4').forEach(h => h.id = slug(h.textContent));
  $doc.querySelectorAll('pre code.language-mermaid').forEach(c => {
    const div = document.createElement('div');
    div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
  if (typeof mermaid !== 'undefined') mermaid.run({ querySelector:'#doc .mermaid' }).catch(() => {});
  // 다른 스터디 문서 링크는 이 페이지 안으로, 저장소 상대 링크는 그대로 둔다.
  $doc.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    const other = DOCS.find(x => href.split('#')[0] === x.file);
    if (other) a.setAttribute('href', '#' + other.id);
    else if (href.startsWith('#')) a.onclick = e => {
      e.preventDefault();
      document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();
    };
  });
  const i = DOCS.indexOf(d), prev = DOCS[i - 1], next = DOCS[i + 1];
  $doc.insertAdjacentHTML('beforeend', '<div class="pager">' +
    (prev ? `<a href="#${prev.id}">← ${prev.title}</a>` : '<span></span>') +
    (next ? `<a href="#${next.id}">${next.title} →</a>` : '<span></span>') + '</div>');
  // 목차: 문서 목록 + 지금 문서의 절(h2) 목록
  const esc = t => t.replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;');
  const subs = [...$doc.querySelectorAll('h2')].map(h => `<a href="#${d.id}" data-anchor="${h.id}">${esc(h.textContent)}</a>`).join('');
  $toc.innerHTML = DOCS.map(x => `<a href="#${x.id}" data-id="${x.id}" class="${x.id === d.id ? 'on' : ''}"><b>${x.id}</b>${x.title}</a>` +
    (x.id === d.id ? `<div class="sub">${subs}</div>` : '')).join('');
  $toc.querySelectorAll('[data-anchor]').forEach(a => a.onclick = e => {
    e.preventDefault(); document.getElementById(a.dataset.anchor)?.scrollIntoView();
  });
  document.title = d.title + ' · 토마토 로봇 스터디';
  window.scrollTo(0, 0);
}

const route = () => show(location.hash.slice(1) || DOCS[0].id);
window.addEventListener('hashchange', route);
route();
</script>
