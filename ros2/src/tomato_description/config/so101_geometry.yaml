# SO-101 팔의 기하 — **이 파일이 정본이다.**
#
# ⚠ 여기 값과 src/tomato_picker/hardware/kinematics.py의 ArmGeometry 기본값이
#    어긋나면, 같은 팔을 두 계통이 서로 다르게 믿는다는 뜻이다. 그 상태에서는
#    대시보드의 좌표 이동과 ROS의 IK가 **다른 곳으로 간다**.
#    ros2/tools/ros_selfcheck.py가 그 일치를 자동으로 검사한다.
#
# ⚠ 자로 재서 고쳐라. 기본값은 SO-101 도면 근사치다. 재는 법은 kinematics.py의
#    ArmGeometry docstring에 있다(팔 힘 빼고 앞으로 쭉 뻗은 상태에서 축과 축 사이).
#
# 단위는 **mm**다. URDF는 m를 쓰지만, 자로 재는 값은 자로 재는 단위로 적는 게
# 맞다 — 변환은 xacro가 한 곳에서 한 번만 한다.

arm:
  # 링크 길이 (kinematics.ArmGeometry와 같은 이름)
  # 2026-08-31 **실측**. 모터 혼(출력축) 중심 사이 거리를 자로 쟀다.
  z0: 119.5    # 마운트 평면 → 2번(shoulder_lift) 혼 중심      (옛 근사치 55.0)
  d0: -31.5    # 1번(pan) 축 → 2번 혼 중심의 수평 오프셋
               # ⚠ **음수 = 뒤쪽**(pan=0에서 팔이 뻗는 +x의 반대). 실측 31.5mm 뒤
  l1: 116.5    # 2번 → 3번(elbow_flex) 혼 중심                 (옛 116.0)
  l2: 138.0    # 3번 → 4번(wrist_flex) 혼 중심                 (옛 135.0)
  l3: 168.0    # 4번 → **집게가 무는 지점**(TCP)               (옛 95.0 ← 1.77배 틀렸다)

  # 관절 한계(도). ⚠ 추정치다 — 실제 한계는 팔 캘리브레이션이 정한다
  # (대시보드 "팔 범위 캘리브레이션"). 여기 값이 실제보다 넓으면 IK가 못 가는
  # 자세를 풀어 준다. **넓게 잡느니 좁게 잡아라.**
  limits_deg:
    shoulder_pan:  [-110.0,  110.0]
    shoulder_lift: [-100.0,  110.0]
    elbow_flex:    [-160.0,  160.0]
    wrist_flex:    [-110.0,  110.0]
    wrist_roll:    [-180.0,  180.0]
    gripper:       [   0.0,   45.0]   # 0 = 닫힘

# 팔이 차체 어디에 앉아 있는가 (base_link → arm_base). **자로 재라.**
# base_link 원점 = 차체 중심, 바닥면. +x 앞, +y 왼쪽, +z 위.
mount:
  x: 60.0        # ⚠ 아직 안 쟀다
  y: 0.0
  z: 76.5        # 2026-08-31 실측: 지면 → 마운트 평면
  yaw_deg: 0.0

# 차체 치수 — 시각화용. 주행 계산에는 안 쓴다.
base:
  length: 300.0
  width: 240.0
  height: 90.0
  wheel_radius: 40.0
